<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 외부로 어떤 네트워크 요청도 못 보내도록 차단 (데이터 유출 방지) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src 'none'; form-action 'none';">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Purse">
<title>Purse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#1c2420;--muted:#6d746f;--line:#e4e0d6;--accent:#1f6f5c;--accent-ink:#fff;--exp:#c2492f;--inc:#2563a8;--soft:#eef3f0;--r:14px;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1b211e;--ink:#e8ece9;--muted:#9aa39e;--line:#2b332f;--accent:#4fb393;--accent-ink:#0d1411;--exp:#ef7f66;--inc:#6ea8ef;--soft:#1f2a25}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.app{max-width:960px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 0 8px}
.month{display:flex;align-items:center;gap:2px}
.month h1{font-size:20px;margin:0 6px;font-weight:700;letter-spacing:-.02em;cursor:pointer;white-space:nowrap}
.icon{border:0;background:transparent;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:22px;line-height:1}
.icon:hover{background:var(--soft)}
.sync-btn{order:3;color:var(--accent)}.sync-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.btn:disabled{opacity:.55;cursor:default}
#summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sum span{display:block;font-size:12px;color:var(--muted)}
.sum b{display:block;font-size:clamp(15px,4.2vw,22px);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:max(18px,calc(50% - 462px));bottom:calc(90px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;z-index:11}
.fab[hidden]{display:none}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:160px}
input[type=search],input[type=text],input[type=password],input[type=date],.field input,.inline input,.budget-row input{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;outline:none}
input:focus{border-color:var(--accent)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.day.card{padding:0;overflow:hidden;margin-bottom:10px}
.day-head{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;cursor:pointer}
.item+.item{border-top:1px solid var(--line)}
.item:hover{background:var(--soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.mid{flex:1;min-width:0}
.mid b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid small{color:var(--muted);font-size:12px}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet-panel{position:relative;background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-head h2{font-size:18px;margin:0}
.amount-field{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);margin:14px 0}
.amount-field input{flex:1;min-width:0;border:0;background:none;font-size:32px;font-weight:700;padding:6px 0;outline:none;text-align:right;font-variant-numeric:tabular-nums}
.amount-field:focus-within{border-color:var(--accent)}
.field{display:block;margin:14px 0}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span,.tag{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;cursor:pointer;background:var(--card)}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tag{cursor:default}
.tag button{border:0;background:none;padding:0 0 0 2px;cursor:pointer;color:var(--muted);font-size:17px;line-height:1}
.actions{display:flex;gap:8px;margin-top:18px}
.btn{border:1px solid var(--line);background:var(--card);padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions .btn.primary{flex:1}
.btn.danger{color:var(--exp)}
.inline{display:flex;gap:6px;margin-top:10px}.inline input{flex:1;min-width:0}
section.card{margin-bottom:12px}
section.card h3{margin:0 0 10px;font-size:15px}
.note{font-size:13px;color:var(--muted);line-height:1.65;margin:6px 0}
.empty{color:var(--muted);text-align:center;padding:30px 0;margin:0}
.bar-row{margin:12px 0}
.bar-label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:8px}
.bar-label em{font-style:normal;color:var(--muted);font-size:12px;margin-left:4px}
.bar-label .dot{margin-right:6px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar>div{height:100%;border-radius:4px}
.bar.over>div{background:var(--exp)!important}
.trend{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.tbars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.tb{width:40%;max-width:20px;border-radius:4px 4px 0 0;min-height:2px}
.inc-bg{background:var(--inc)}.exp-bg{background:var(--exp)}
.tcol small{font-size:12px;color:var(--muted);margin-top:6px}
.tcol.cur small{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.budget-row{display:grid;grid-template-columns:1fr 140px;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.budget-row input{width:100%;text-align:right;padding:8px 10px}
.budget-row .bar{grid-column:1/-1}
.budget-row small{color:var(--muted);font-size:12px}
.banner{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.banner button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.file-btn{position:relative;overflow:hidden;display:inline-block}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pw{width:100%;margin-top:4px}
@media (min-width:820px){
  body{padding-bottom:40px}
  nav.tabs{position:static;border:0;background:none;padding:0;gap:4px}
  nav.tabs button{flex:none;flex-direction:row;padding:8px 14px;border-radius:999px;font-size:14px;gap:6px}
  nav.tabs button.on{background:var(--soft)}
  nav.tabs svg{width:18px;height:18px}
  .fab{bottom:32px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid2>section{margin-bottom:0}
  .grid2{margin-bottom:12px}
  .sheet{align-items:center}
  .sheet-panel{border-radius:20px}
  .toast{bottom:110px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="month">
      <button class="icon" id="prev" aria-label="이전 달">‹</button>
      <h1 id="monthLabel" title="이번 달로 이동">-</h1>
      <button class="icon" id="next" aria-label="다음 달">›</button>
    </div>
    <button class="icon sync-btn" data-view="settings" aria-label="동기화"><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 4v4h-4M20 15a8 8 0 0 1-14 3l-2-2M4 20v-4h4"/></svg></button>
    <nav class="tabs">
      <button data-view="list"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>내역</button>
      <button data-view="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-7"/></svg>통계</button>
      <button data-view="budget"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M15.5 14.5h2"/></svg>예산</button>
      <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>설정</button>
    </nav>
  </header>
  <div id="summary"></div>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="내역 추가">+</button>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <form class="sheet-panel" id="txForm" autocomplete="off"></form>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* ===== 저장소: 이 기기·이 브라우저 안(localStorage)에만 저장 ===== */
const KEY = 'household-ledger-v1';
const fresh = () => ({
  v: 1, tx: [], deleted: {}, budgets: {}, budgetsAt: 0, lastBackup: 0,
  cats: {
    expense: ['식비','카페·간식','장보기','교통','주거·관리비','통신','의료','교육','육아','쇼핑','문화·여가','경조사','보험','기타'],
    income: ['급여','부수입','용돈','이자·배당','기타']
  },
  methods: ['카드','현금','계좌이체']
});
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ const d = JSON.parse(raw); const f = fresh(); return {...f, ...d, cats:{...f.cats, ...(d.cats||{})}}; }
  }catch(e){}
  return fresh();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('저장하지 못했어요. 브라우저 저장공간을 확인하세요.'); }
}
let S = load();
const PWKEY = 'household-ledger-syncpw'; // 동기화 비밀번호: 이 기기에만 저장, 백업 파일에는 포함 안 됨
const getSyncPw = () => { try{ return localStorage.getItem(PWKEY) || ''; }catch(e){ return ''; } };
const setSyncPw = v => { try{ v ? localStorage.setItem(PWKEY, v) : localStorage.removeItem(PWKEY); }catch(e){} };
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isStandalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ===== 유틸 ===== */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const won = n => Math.round(n).toLocaleString('ko-KR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const digits = v => parseInt(String(v).replace(/[^\d]/g,''), 10) || 0;
const DOW = ['일','월','화','수','목','금','토'];
const PALETTE = ['#d0643f','#2f7fb8','#3f9b6e','#c9932a','#8a5cc2','#d14f7c','#4aa3a3','#7d8b2f','#b86b3f','#5b6fd1','#9a7b5f','#c25b5b','#3d8fd1','#a0a03a'];
function catColor(c){
  let i = S.cats.expense.indexOf(c);
  if(i < 0){ const j = S.cats.income.indexOf(c); if(j >= 0) i = j + 3; }
  if(i < 0){ i = 0; for(const ch of String(c)) i = (i*31 + ch.charCodeAt(0)) >>> 0; }
  return PALETTE[i % PALETTE.length];
}
let toastTimer;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2400); }

/* ===== 상태 ===== */
const now0 = new Date();
let Y = now0.getFullYear(), M = now0.getMonth()+1;
let view = 'list', q = '', filt = 'all';
const ym = () => `${Y}-${pad(M)}`;
const monthTx = () => S.tx.filter(t => t.date.startsWith(ym()));
function sums(list){ let i=0,e=0; for(const t of list){ if(t.type==='income') i+=t.amount; else e+=t.amount; } return {i,e}; }
const totalBudget = () => S.cats.expense.reduce((s,c)=>s+(S.budgets[c]||0),0);

/* ===== 렌더 ===== */
function render(){
  $('#monthLabel').textContent = `${Y}년 ${M}월`;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.view===view));
  $('#fab').hidden = view === 'settings';
  renderSummary();
  ({list:renderList, stats:renderStats, budget:renderBudget, settings:renderSettings})[view]();
}
function renderSummary(){
  const {i,e} = sums(monthTx()); const b = totalBudget();
  $('#summary').innerHTML = `
    <div class="card sum"><span>수입</span><b class="inc">${won(i)}</b></div>
    <div class="card sum"><span>지출</span><b class="exp">${won(e)}</b>${b?`<small>예산의 ${Math.round(e/b*100)}%</small>`:''}</div>
    <div class="card sum"><span>잔액</span><b>${won(i-e)}</b></div>`;
}

function renderList(){
  const needBackup = S.tx.length > 0 && (!S.lastBackup || Date.now()-S.lastBackup > 30*864e5);
  $('#view').innerHTML = `
    ${isIOS && !isStandalone ? `<div class="banner"><span><b>홈 화면에 추가해서 쓰세요.</b> Safari 공유 버튼 → '홈 화면에 추가'. Safari 탭에서 쓰면 한동안 안 열 때 데이터가 지워질 수 있고, 홈 화면 앱과 저장공간도 따로예요.</span></div>`:''}
    ${needBackup ? `<div class="banner"><span>${S.lastBackup?'마지막 백업 후 한 달이 지났어요.':'아직 백업한 적이 없어요.'} 기기를 바꾸거나 브라우저 데이터를 지우면 내역이 사라질 수 있어요.</span><button data-view="settings">백업하기</button></div>`:''}
    <div class="toolbar">
      <input type="search" id="q" placeholder="검색 (메모·카테고리)" value="${esc(q)}">
      <div class="seg" id="filt">
        ${[['all','전체'],['expense','지출'],['income','수입']].map(([k,l])=>`<button data-filt="${k}" class="${filt===k?'on':''}">${l}</button>`).join('')}
      </div>
    </div>
    <div id="listBody"></div>`;
  renderListBody();
}
function renderListBody(){
  const qq = q.trim().toLowerCase();
  const list = monthTx()
    .filter(t => (filt==='all' || t.type===filt) && (!qq || `${t.memo} ${t.cat} ${t.method}`.toLowerCase().includes(qq)))
    .sort((a,b) => b.date.localeCompare(a.date) || (b.created||0)-(a.created||0));
  if(!list.length){
    $('#listBody').innerHTML = `<p class="empty">${monthTx().length ? '조건에 맞는 내역이 없어요' : '이 달의 내역이 없어요.<br>오른쪽 아래 + 버튼으로 추가해 보세요.'}</p>`;
    return;
  }
  const groups = new Map();
  for(const t of list){ if(!groups.has(t.date)) groups.set(t.date, []); groups.get(t.date).push(t); }
  let html = '';
  for(const [date, items] of groups){
    const d = new Date(date+'T00:00:00'); const {i,e} = sums(items);
    html += `<div class="day card"><div class="day-head"><span>${d.getDate()}일 (${DOW[d.getDay()]})</span><span>${i?`<span class="inc">+${won(i)}</span> `:''}${e?`<span class="exp">-${won(e)}</span>`:''}</span></div>
      ${items.map(t=>`<button class="item" data-edit="${t.id}">
        <span class="dot" style="background:${catColor(t.cat)}"></span>
        <span class="mid"><b>${esc(t.memo||t.cat)}</b><small>${esc(t.cat)}${t.method?' · '+esc(t.method):''}</small></span>
        <span class="amt ${t.type==='income'?'inc':'exp'}">${t.type==='income'?'+':'-'}${won(t.amount)}</span>
      </button>`).join('')}</div>`;
  }
  $('#listBody').innerHTML = html;
}

function bars(list, type){
  const m = {}; for(const t of list) if(t.type===type) m[t.cat]=(m[t.cat]||0)+t.amount;
  const arr = Object.entries(m).sort((a,b)=>b[1]-a[1]);
  const tot = arr.reduce((s,x)=>s+x[1],0);
  if(!tot) return '<p class="empty">내역이 없어요</p>';
  return arr.map(([c,v])=>`<div class="bar-row">
    <div class="bar-label"><span><i class="dot" style="background:${catColor(c)}"></i>${esc(c)}</span><span>${won(v)}원<em>${(v/tot*100).toFixed(1)}%</em></span></div>
    <div class="bar"><div style="width:${v/arr[0][1]*100}%;background:${catColor(c)}"></div></div></div>`).join('');
}
function renderStats(){
  const list = monthTx(); const {i,e} = sums(list);
  const n = new Date(); const isCur = Y===n.getFullYear() && M===n.getMonth()+1;
  const days = isCur ? n.getDate() : new Date(Y,M,0).getDate();
  const months = [];

/* ===== 백업 (선택적 AES-GCM 암호화) ===== */
function b64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
let keyCache = {pw:null, salt:null, key:null};
async function encryptPayload(pw, payload){
  if(keyCache.pw !== pw){ const salt = crypto.getRandomValues(new Uint8Array(16)); keyCache = {pw, salt, key: await deriveKey(pw, salt)}; }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, keyCache.key, new TextEncoder().encode(JSON.stringify(payload)));
  return {format:'household-ledger-backup', v:1, enc:true, salt:b64(keyCache.salt), iv:b64(iv), data:b64(new Uint8Array(ct))};
}
/* 동기화 파일은 미리 만들어 둠 (iOS는 버튼을 누른 즉시 공유창을 열어야 해서) */
let prepared = null;
const canShareFile = f => !!(navigator.canShare && navigator.share && navigator.canShare({files:[f]}));
async function prepareSync(){
  prepared = null;
  const btn = $('#syncSend'); const pw = getSyncPw();
  if(!btn || !pw) return;
  btn.disabled = true; btn.textContent = '준비 중…';
  try{
    if(!(window.crypto && crypto.subtle)) throw new Error('nocrypto');
    const out = await encryptPayload(pw, {...S, savedAt: Date.now()});
    const n = new Date();
    prepared = new File([JSON.stringify(out)], `가계부동기화_${dstr(n)}_${pad(n.getHours())}${pad(n.getMinutes())}.json`, {type:'application/json'});
    if($('#syncSend') === btn){ btn.disabled = false; btn.textContent = canShareFile(prepared) ? '보내기 (AirDrop)' : '동기화 파일 저장'; }
  }catch(e){
    if($('#syncSend') === btn) btn.textContent = e.message==='nocrypto' ? 'https 주소에서 열어야 해요' : '준비 실패';
  }
}
function sendSync(){
  const f = prepared; if(!f) return;
  const done = () => { S.lastSent = S.lastBackup = Date.now(); save(); renderSettings(); };
  if(canShareFile(f)){
    navigator.share({files:[f], title:'가계부 동기화'})
      .then(() => { done(); toast('보냈어요. 받는 기기에서 "받은 파일 불러오기"를 누르세요'); })
      .catch(err => { if(err && err.name !== 'AbortError') toast('공유하지 못했어요. 다시 눌러 주세요'); });
  } else {
    const url = URL.createObjectURL(f); const a = document.createElement('a'); a.href = url; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
    done(); toast('동기화 파일을 저장했어요');
  }
}
async function exportBackup(){
  const pw = $('#bkPw').value;
  const payload = {...S, savedAt: Date.now()};
  let out;
  if(pw){
    if(!(window.crypto && crypto.subtle)){ toast('이 환경에선 암호화를 쓸 수 없어요 (https 주소에서 열어주세요)'); return; }
    out = await encryptPayload(pw, payload);
  } else {
    out = {format:'household-ledger-backup', v:1, enc:false, data:payload};
  }
  download(`가계부백업_${dstr(new Date())}${pw?'_암호화':''}.json`, JSON.stringify(out), 'application/json');
  S.lastBackup = Date.now(); save(); render();
  toast(pw ? '암호화된 백업 파일을 저장했어요' : '백업 파일을 저장했어요');
}
function cleanTx(t){
  if(!t || typeof t.id!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(t.date) || !['income','expense'].includes(t.type) || !Number.isFinite(+t.amount)) return null;
  return {id:t.id.slice(0,40), type:t.type, amount:Math.abs(Math.round(+t.amount)), date:t.date, cat:String(t.cat||'기타').slice(0,30),
    method:String(t.method||'').slice(0,30), memo:String(t.memo||'').slice(0,80), created:+t.created||0, updated:+t.updated||0};
}
function merge(inc){
  const map = new Map(S.tx.map(t=>[t.id,t]));
  const del = {...S.deleted};
  for(const [k,v] of Object.entries(inc.deleted||{})) if(typeof v==='number' && (!del[k] || del[k]<v)) del[k]=v;
  let added=0, updated=0;
  for(const raw of (Array.isArray(inc.tx)?inc.tx:[])){
    const t = cleanTx(raw); if(!t) continue;
    const e = map.get(t.id);
    if(!e){ map.set(t.id,t); added++; } else if(t.updated > (e.updated||0)){ map.set(t.id,t); updated++; }
  }
  for(const [id,ts] of Object.entries(del)){ const t = map.get(id); if(t && (t.updated||0) <= ts){ map.delete(id); } }
  S.tx = [...map.values()]; S.deleted = del;
  const uni = (a,b) => [...new Set([...(a||[]), ...((Array.isArray(b)?b:[]).map(x=>String(x).slice(0,20)))])];
  if(inc.cats){ S.cats.expense = uni(S.cats.expense, inc.cats.expense); S.cats.income = uni(S.cats.income, inc.cats.income); }
  S.methods = uni(S.methods, inc.methods);
  if((+inc.budgetsAt||0) > (S.budgetsAt||0) && inc.budgets && typeof inc.budgets==='object'){
    S.budgets = {}; for(const [k,v] of Object.entries(inc.budgets)) if(Number.isFinite(+v) && +v>0) S.budgets[k]=Math.round(+v);
    S.budgetsAt = +inc.budgetsAt;
  }
  return {added, updated};
}
async function importBackup(file){
  let obj;
  try{ obj = JSON.parse(await file.text()); }catch(e){ toast('가계부 백업 파일이 아니에요'); return; }
  if(!obj || obj.format!=='household-ledger-backup'){ toast('가계부 백업 파일이 아니에요'); return; }
  let data;
  if(obj.enc){
    const pws = [...new Set([($('#bkPw')||{}).value, getSyncPw()].filter(Boolean))];
    if(!pws.length){ toast('암호화된 파일이에요. 동기화 비밀번호를 먼저 설정하세요'); return; }
    if(!(window.crypto && crypto.subtle)){ toast('이 환경에선 복호화를 쓸 수 없어요 (https 주소에서 열어주세요)'); return; }
    for(const pw of pws){
      try{
        const key = await deriveKey(pw, unb64(obj.salt));
        const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(obj.iv)}, key, unb64(obj.data));
        data = JSON.parse(new TextDecoder().decode(pt)); break;
      }catch(e){}
    }
    if(!data){ toast('비밀번호가 맞지 않아요. 두 기기의 동기화 비밀번호가 같은지 확인하세요'); return; }
  } else data = obj.data;
  const r = merge(data || {}); S.lastReceived = Date.now(); save(); render();
  const when = data && data.savedAt ? new Date(data.savedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'에 만든 파일 · ' : '';
  toast(`${when}새 내역 ${r.added}건, 수정 ${r.updated}건 반영`);
}
function exportCSV(all){
  const list = (all ? S.tx : monthTx()).slice().sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length){ toast('내보낼 내역이 없어요'); return; }
  const q = s => `"${String(s).replace(/"/g,'""')}"`;
  const rows = [['날짜','구분','카테고리','금액','결제수단','메모'].join(',')]
    .concat(list.map(t => [t.date, t.type==='income'?'수입':'지출', q(t.cat), t.type==='income'?t.amount:-t.amount, q(t.method), q(t.memo)].join(',')));
  download(`가계부_${all?'전체':ym()}.csv`, '﻿' + rows.join('\r\n'), 'text/csv;charset=utf-8');
}

document.addEventListener('click', e => {
  const el = sel => e.target.closest(sel);
  let b;
  if((b = el('[data-view]'))){ view = b.dataset.view; render(); window.scrollTo(0,0); return; }
  if(el('#prev')){ if(--M<1){M=12;Y--;} render(); return; }
  if(el('#next')){ if(++M>12){M=1;Y++;} render(); return; }
  if(el('#monthLabel')){ const n=new Date(); Y=n.getFullYear(); M=n.getMonth()+1; render(); return; }
  if(el('#fab')){ openForm(); return; }
  if((b = el('[data-edit]'))){ const t = S.tx.find(x=>x.id===b.dataset.edit); if(t) openForm(t); return; }
  if(el('[data-close]')){ closeForm(); return; }
  if((b = el('[data-ft]'))){ formType = b.dataset.ft; fillChips(null, null); return; }
  if((b = el('[data-filt]'))){ filt = b.dataset.filt; document.querySelectorAll('[data-filt]').forEach(x=>x.classList.toggle('on', x===b)); renderListBody(); return; }
  if(el('#fDel')){
    if(!editing || !confirm('이 내역을 삭제할까요?')) return;
    const id = editing.id; S.tx = S.tx.filter(t=>t.id!==id); S.deleted[id] = Date.now();
    save(); closeForm(); render(); toast('삭제했어요'); return;
  }
  if((b = el('[data-delcat]'))){
    const key = b.dataset.delcat, name = b.dataset.name;
    const list = key==='methods' ? S.methods : S.cats[key];
    if(list.length <= 1){ toast('최소 하나는 남겨야 해요'); return; }
    if(!confirm(`'${name}' 항목을 목록에서 뺄까요? (기존 내역은 그대로 남아요)`)) return;
    list.splice(list.indexOf(name), 1); save(); renderSettings(); return;
  }
  if(el('#syncSend')){ sendSync(); return; }
  if(el('#syncPwReset')){ if(confirm('동기화 비밀번호를 다시 설정할까요? 다른 기기도 같은 비밀번호로 바꿔야 해요.')){ setSyncPw(''); keyCache = {pw:null}; renderSettings(); } return; }
  if(el('#exportBtn')){ exportBackup().catch(()=>toast('백업 중 오류가 났어요')); return; }
  if(el('#csvMonth')){ exportCSV(false); return; }
  if(el('#csvAll')){ exportCSV(true); return; }
  if(el('#wipe')){
    if(!confirm('이 기기의 모든 가계부 데이터를 삭제할까요?')) return;
    if(!confirm('정말 삭제할까요? 되돌릴 수 없어요.')) return;
    try{ localStorage.removeItem(KEY); }catch(_){}
    S = fresh(); view = 'list'; render(); toast('모두 삭제했어요');
  }
});
document.addEventListener('submit', e => {
  if(e.target.id === 'syncPwForm'){
    e.preventDefault(); const v = $('#syncPw').value;
    if(v.length < 6){ toast('6자 이상으로 정해 주세요'); return; }
    setSyncPw(v); renderSettings(); toast('설정했어요. 다른 기기에도 같은 비밀번호를 설정하세요'); return;
  }
  const f = e.target.closest('form[data-addcat]'); if(!f) return;
  e.preventDefault();
  const name = f.querySelector('input').value.trim().slice(0,20);
  if(!name) return;
  const key = f.dataset.addcat; const list = key==='methods' ? S.methods : S.cats[key];
  if(list.includes(name)){ toast('이미 있는 항목이에요'); return; }
  list.push(name); save(); renderSettings();
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id==='q'){ q = t.value; renderListBody(); return; }
  if(t.id==='fAmt' || t.dataset.budget !== undefined){
    const d = String(t.value).replace(/\D/g,'').slice(0,12);
    t.value = d ? Number(d).toLocaleString('ko-KR') : '';
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset && t.dataset.budget !== undefined){
    const v = digits(t.value);
    if(v) S.budgets[t.dataset.budget] = v; else delete S.budgets[t.dataset.budget];
    S.budgetsAt = Date.now(); save(); renderSummary(); renderBudget(); return;
  }
  if((t.id==='importFile' || t.id==='syncFile') && t.files[0]){ importBackup(t.files[0]); t.value=''; }
});
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && !$('#sheet').hidden){ closeForm(); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!typing && $('#sheet').hidden && (e.key==='n' || e.key==='+') && !e.metaKey && !e.ctrlKey){ e.preventDefault(); openForm(); }
});
window.addEventListener('storage', e => { if(e.key===KEY){ S = load(); render(); } });

render();
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
