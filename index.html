<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 외부로 어떤 네트워크 요청도 못 보내도록 차단 (데이터 유출 방지) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src 'none'; form-action 'none';">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Purse">
<title>Purse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#1c2420;--muted:#6d746f;--line:#e4e0d6;--accent:#1f6f5c;--accent-ink:#fff;--exp:#c2492f;--inc:#2563a8;--soft:#eef3f0;--r:14px;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1b211e;--ink:#e8ece9;--muted:#9aa39e;--line:#2b332f;--accent:#4fb393;--accent-ink:#0d1411;--exp:#ef7f66;--inc:#6ea8ef;--soft:#1f2a25}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.app{max-width:960px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 0 8px}
.month{display:flex;align-items:center;gap:2px}
.month h1{font-size:20px;margin:0 6px;font-weight:700;letter-spacing:-.02em;cursor:pointer;white-space:nowrap;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.icon{border:0;background:transparent;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:22px;line-height:1;flex:none}
.icon:hover{background:var(--soft)}
.icon.sm{width:32px;height:32px;font-size:15px;color:var(--muted)}
.sync-btn{order:3;color:var(--accent)}.sync-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
#summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sum span{display:block;font-size:12px;color:var(--muted)}
.sum b{display:block;font-size:clamp(15px,4.2vw,22px);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum small{display:block;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.4}
.inc{color:var(--inc)}.exp{color:var(--exp)}.up{color:var(--exp)}.down{color:var(--inc)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:max(18px,calc(50% - 462px));bottom:calc(90px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;z-index:11}
.fab[hidden],[hidden]{display:none!important}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:150px}
input[type=search],input[type=text],input[type=password],input[type=date],.field input,.inline input,.budget-row input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:8px 13px;border-radius:8px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.day.card{padding:0;overflow:hidden;margin-bottom:10px}
.day-head{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;cursor:pointer}
.item+.item{border-top:1px solid var(--line)}
.item:hover,.arow:hover{background:var(--soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.mid{flex:1;min-width:0}
.mid b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.amt small{display:block;font-size:12px;font-weight:500}
.tagk{font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--soft);color:var(--accent);margin-left:6px;vertical-align:1px;font-weight:600}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet-panel{position:relative;background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-head h2{font-size:18px;margin:0}
.amount-field{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);margin:14px 0}
.amount-field input{flex:1;min-width:0;border:0;background:none;font-size:32px;font-weight:700;padding:6px 0;outline:none;text-align:right;font-variant-numeric:tabular-nums}
.amount-field:focus-within{border-color:var(--accent)}
.field{display:block;margin:14px 0}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input{width:100%}
.ck{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:15px;cursor:pointer}
.ck input,.ck-row input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span,.tag,.chip-add{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;cursor:pointer;background:var(--card)}
.chip-add{border-style:dashed;color:var(--muted)}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tag{cursor:default}
.tag button{border:0;background:none;padding:0 0 0 2px;cursor:pointer;color:var(--muted);font-size:17px;line-height:1}
.actions{display:flex;gap:8px;margin-top:18px}
.btn{border:1px solid var(--line);background:var(--card);padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:15px;white-space:nowrap}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions .btn.primary{flex:1}
.btn.danger{color:var(--exp)}
.btn:disabled{opacity:.55;cursor:default}
.inline{display:flex;gap:6px;margin-top:10px}.inline input{flex:1;min-width:0}
section.card{margin-bottom:12px}
section.card h3{margin:0 0 10px;font-size:15px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.sec-head h3{margin:0!important}
.sec-head h3 small{color:var(--muted);font-weight:500;margin-left:6px;font-size:13px}
.note{font-size:13px;color:var(--muted);line-height:1.65;margin:6px 0}
.empty{color:var(--muted);text-align:center;padding:24px 0;margin:0;font-size:14px}
.bar-row{margin:12px 0}
.bar-label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:8px}
.bar-label em{font-style:normal;color:var(--muted);font-size:12px;margin-left:4px}
.bar-label .dot{margin-right:6px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar>div{height:100%;border-radius:4px}
.bar.over>div{background:var(--exp)!important}
.trend{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.tbars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.tb{width:40%;max-width:20px;border-radius:4px 4px 0 0;min-height:2px}
.inc-bg{background:var(--inc)}.exp-bg{background:var(--exp)}
.tcol small{font-size:12px;color:var(--muted);margin-top:6px}
.tcol.cur small{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.budget-row{display:grid;grid-template-columns:1fr 140px;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.budget-row input{width:100%;text-align:right;padding:8px 10px}
.budget-row .bar{grid-column:1/-1}
.budget-row small{color:var(--muted);font-size:12px}
.banner{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:center;line-height:1.5}
.banner button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.file-btn{position:relative;overflow:hidden;display:inline-block}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pw{width:100%;margin-top:4px}
/* 자산 */
.big{font-size:30px;font-weight:700;display:block;margin:2px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted);font-size:13px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);margin:14px 0 10px}
.stack div{height:100%}
.alloc{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 16px;font-size:13px}
.alloc div{display:flex;justify-content:space-between;gap:6px}
.alloc span{color:var(--muted)}
.arow{display:flex;gap:12px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:11px 4px;text-align:left;cursor:pointer;border-radius:0}
.arow .mid small{white-space:normal;line-height:1.5}
.loanbar{height:5px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}
.loanbar div{height:100%;background:var(--accent)}
.hist-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;border-top:1px dashed var(--line)}
/* 고정지출 */
.fx-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
.fx-ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--accent-ink);font-weight:700;cursor:pointer;flex:none;font-size:16px;line-height:1;padding:0}
.fx-row.done .fx-ck{background:var(--accent);border-color:var(--accent)}
.fx-body{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:12px 0;text-align:left;cursor:pointer}
.fx-row.done .mid b{color:var(--muted)}
.muted small,.amt small.muted{color:var(--muted)}
.cmp{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.cmp th{font-weight:500;color:var(--muted);font-size:12px;text-align:right;padding:4px 0 6px}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:9px 0;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.cmp tr.total td{font-weight:700;border-top:2px solid var(--line)}
.cmp td small{display:block;font-size:11px;font-weight:500}
.bar.dual{position:relative;overflow:visible;margin:2px 0 4px}
.bar.dual>i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.bar-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:10px}
/* 카드 */
.ck-row{display:flex;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:12;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px}
.selbar b{font-variant-numeric:tabular-nums}
.selbar .btn{background:var(--accent);color:var(--accent-ink);border:0}
.card-line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
/* 설정: 카테고리 편집 */
.cat-row{display:flex;align-items:center;gap:4px;padding:4px 0;border-top:1px solid var(--line)}
.cat-row input{flex:1;min-width:0;border:1px solid transparent;background:transparent;padding:8px;border-radius:8px;font-size:16px}
.cat-row input:focus{border-color:var(--accent);background:var(--card)}
.cat-row select{padding:6px 8px;font-size:14px}
.kind-tog{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.kind-tog.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (min-width:820px){
  body{padding-bottom:110px}
  nav.tabs{position:static;border:0;background:none;padding:0;gap:2px}
  nav.tabs button{flex:none;flex-direction:row;padding:8px 12px;border-radius:999px;font-size:14px;gap:6px}
  nav.tabs button.on{background:var(--soft)}
  nav.tabs svg{width:18px;height:18px}
  .fab{bottom:32px}
  .selbar{bottom:28px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
  .grid2>section{margin-bottom:0}
  .sheet{align-items:center}
  .sheet-panel{border-radius:20px}
  .toast{bottom:110px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="month">
      <button class="icon" id="prev" aria-label="이전 달">‹</button>
      <h1 id="monthLabel" title="이번 달로 이동">-</h1>
      <button class="icon" id="next" aria-label="다음 달">›</button>
    </div>
    <button class="icon sync-btn" data-view="settings" aria-label="동기화·설정"><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 14-3l2 2M20 4v4h-4M20 15a8 8 0 0 1-14 3l-2-2M4 20v-4h4"/></svg></button>
    <nav class="tabs">
      <button data-view="list"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>내역</button>
      <button data-view="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-7"/></svg>통계</button>
      <button data-view="fixed"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>고정·예산</button>
      <button data-view="assets"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l7 4"/></svg>자산</button>
      <button data-view="cards"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>카드</button>
      <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>설정</button>
    </nav>
  </header>
  <div id="summary"></div>
  <main id="view"></main>
</div>
<button class="fab" id="fab" aria-label="내역 추가">+</button>
<div class="selbar" id="selbar" hidden></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <form class="sheet-panel" id="sheetForm" autocomplete="off"></form>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
'use strict';
/* ================= 저장소 (이 기기·이 브라우저 안에만 저장) ================= */
const KEY = 'household-ledger-v1';   // 기존 데이터와 호환을 위해 키는 그대로 유지
const fresh = () => ({
  v: 2, tx: [], deleted: {}, budgets: {}, budgetsAt: 0, lastBackup: 0, metaAt: 0,
  cats: {
    expense: ['식비','카페·간식','장보기','교통','주거·관리비','통신','의료','교육','육아','쇼핑','문화·여가','경조사','보험','대출상환','기타'],
    income: ['급여','부수입','용돈','이자·배당','기타']
  },
  fixedCats: ['주거·관리비','통신','보험','교육','대출상환'],
  methods: ['현금','계좌이체'],
  cards: [{name:'카드', payDay:0}],
  recurring: [],
  assets: {cash:[], savings:[], stocks:[], use:[]}
});
// 이전 버전 데이터를 새 구조로 변환 (데이터 손실 없음)
function migrate(d){
  d = (d && typeof d === 'object') ? d : {};
  const f = fresh(); const s = {...f, ...d};
  s.cats = {...f.cats, ...(d.cats || {})};
  if(!Array.isArray(s.tx)) s.tx = [];
  s.tx = s.tx.filter(t => t && typeof t === 'object');
  if(!s.deleted || typeof s.deleted !== 'object') s.deleted = {};
  if(!s.budgets || typeof s.budgets !== 'object') s.budgets = {};
  s.assets = {...f.assets, ...((d.assets && typeof d.assets === 'object') ? d.assets : {})};
  for(const k of Object.keys(f.assets)) if(!Array.isArray(s.assets[k])) s.assets[k] = [];
  if(!Array.isArray(d.cards)){
    const ms = Array.isArray(d.methods) ? d.methods : ['카드','현금','계좌이체'];
    s.cards = ms.filter(m => String(m).includes('카드')).map(name => ({name:String(name), payDay:0}));
    s.methods = ms.filter(m => !String(m).includes('카드'));
  }
  if(!Array.isArray(s.methods)) s.methods = [...f.methods];
  if(!Array.isArray(d.fixedCats)) s.fixedCats = f.fixedCats.filter(c => s.cats.expense.includes(c));
  if(!Array.isArray(s.recurring)) s.recurring = [];
  for(const t of s.tx) if(t.type === 'expense' && !t.kind) t.kind = s.fixedCats.includes(t.cat) ? 'fixed' : 'variable';
  s.v = 2;
  return s;
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return migrate(JSON.parse(raw)); }catch(e){}
  return fresh();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('저장하지 못했어요. 기기 저장공간을 확인하세요.'); }
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const digits = v => parseInt(String(v).replace(/[^\d]/g,''), 10) || 0;
const dec = v => parseFloat(String(v).replace(/,/g,'')) || 0;
const num = v => Number.isFinite(+v) ? +v : 0;
const str = (v, n=40) => String(v ?? '').slice(0, n);

const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
const dday = ds => Math.round((new Date(ds+'T00:00:00') - today0()) / 864e5);
const ddTxt = n => n === 0 ? 'D-day' : n > 0 ? `D-${n}` : `D+${-n}`;
const DOW = ['일','월','화','수','목','금','토'];
const PALETTE = ['#d0643f','#2f7fb8','#3f9b6e','#c9932a','#8a5cc2','#d14f7c','#4aa3a3','#7d8b2f','#b86b3f','#5b6fd1','#9a7b5f','#c25b5b','#3d8fd1','#a0a03a','#6b8e5a'];
function catColor(c){
  let i = S.cats.expense.indexOf(c);
  if(i < 0){ const j = S.cats.income.indexOf(c); if(j >= 0) i = j + 3; }
  if(i < 0){ i = 0; for(const ch of String(c)) i = (i*31 + ch.charCodeAt(0)) >>> 0; }
  return PALETTE[i % PALETTE.length];
}
const isCard = m => S.cards.some(c => c.name === m);
const allMethods = () => [...S.cards.map(c => c.name), ...S.methods];
const touchMeta = () => { S.metaAt = Date.now(); };

    ${needBackup ? `<div class="banner"><span>${S.lastBackup?'마지막 백업 후 한 달이 지났어요.':'아직 백업한 적이 없어요.'}</span><button data-view="settings">백업하기</button></div>`:''}

function renderListBody(){

    .sort((a,b) => b.date.localeCompare(a.date) || (b.created||0)-(a.created||0));
  if(!list.length){

function txRow(t){
  const card = t.type==='expense' && isCard(t.method);

    <span class="amt ${t.type==='income'?'inc':'exp'}">${t.type==='income'?'+':'-'}${won(t.amount)}</span></button>`;

/* ----- 통계 ----- */
function bars(list, type){
  const m = {}; for(const t of list) if(t.type===type) m[t.cat]=(m[t.cat]||0)+t.amount;
  const arr = Object.entries(m).sort((a,b)=>b[1]-a[1]);
  const tot = arr.reduce((s,x)=>s+x[1],0);
  if(!tot) return '<p class="empty">내역이 없어요</p>';
  return arr.map(([c,v])=>barRow(c, v, tot, arr[0][1], catColor(c))).join('');
}
const barRow = (label, v, tot, max, color) => `<div class="bar-row">
  <div class="bar-label"><span><i class="dot" style="background:${color}"></i>${esc(label)}</span><span>${won(v)}원<em>${tot?(v/tot*100).toFixed(1):0}%</em></span></div>
  <div class="bar"><div style="width:${max?v/max*100:0}%;background:${color}"></div></div></div>`;
function renderStats(){
  const list = monthTx(); const {i,e,f,v} = sums(list);

        <small>${d.m}월</small></div>`).join('')}</div>
      <div class="legend"><span><i class="inc-bg"></i>수입</span><span><i class="exp-bg"></i>지출</span></div>
    </section>`;
}

/* ----- 고정지출 월별 관리 ----- */
function renderFixed(){
  const items = activeRec().map(r => ({r, tx: recTx(r), due: recDue(r)}));
  const extra = monthTx().filter(t => t.type==='expense' && t.kind==='fixed' && !t.rid).sort((a,b)=>a.date.localeCompare(b.date));
  const extraSum = extra.reduce((s,t)=>s+t.amount,0);

  const doneItems = items.filter(x=>x.tx), doneAmt = doneItems.reduce((s,x)=>s+x.tx.amount,0) + extraSum;
  let py = Y, pm = M-1; if(pm < 1){ pm = 12; py--; }
  const prevF = sums(S.tx.filter(t=>t.date.startsWith(`${py}-${pad(pm)}`))).f;

  const dual = (label, b, a, color) => { const mx = Math.max(b,a,1); return `<div class="bar-cap"><span>${label}</span><span>${b?Math.round(a/b*100)+'% 사용':'예산 없음'}</span></div>

  $('#view').innerHTML = `
    <section class="card"><h3>${M}월 예산 vs 실행</h3>

        <tr class="total"><td>합계</td><td>${won(fB+vB)}</td><td>${won(fA+vA)}</td>${diffCell(fB+vB,fA+vA)}</tr></table>
      ${dual('고정지출', fB, fA, '#1f6f5c')}${dual('변동지출', vB, vA, '#c9932a')}
      <p class="note">막대는 실행, 세로선은 예산 위치예요.${prevF ? ` 지난달 고정지출 ${won(prevF)}원.`:''}</p>
    </section>
    <section class="card"><span class="muted">고정지출 진행</span>
      <div class="bar-cap" style="margin-top:4px"><span>완료 ${doneItems.length}/${items.length}건 · ${won(doneAmt)}원</span><span>남은 금액 <b class="exp">${won(Math.max(0,plan-doneAmt))}원</b></span></div>
      <div class="bar" style="margin-top:6px"><div style="width:${plan?Math.min(100,doneAmt/plan*100):0}%;background:var(--accent)"></div></div>
    </section>
    <section class="card"><div class="sec-head"><h3>매달 나가는 항목</h3><button class="btn sm" id="recNew">+ 항목 추가</button></div>
      ${items.length ? items.map(x=>`<div class="fx-row ${x.tx?'done':''}">

          <button class="fx-body" data-fxedit="${x.r.id}"><span class="mid"><b>${esc(x.r.name)}${x.r.loanId?'<span class="tagk">대출 목표</span>':x.r.vary?'<span class="tagk">금액 변동</span>':''}</b>
            <small>${status(x)} · ${esc(x.r.cat)}${x.r.method?' · '+esc(x.r.method):''}${x.r.end?` · ${x.r.end.replace('-','.')}까지`:''}</small></span>
            <span class="amt">${won(x.tx ? x.tx.amount : x.r.amount)}<small class="${x.tx && x.tx.amount>x.r.amount?'exp':'muted'}">${x.tx ? `예산 ${won(x.r.amount)}${x.tx.amount!==x.r.amount?` (${x.tx.amount>x.r.amount?'+':''}${won(x.tx.amount-x.r.amount)})`:''}` : '예산'}</small></span></button></div>`).join('')
        : `<p class="note">월세·관리비·보험료·통신비·학원비·적금처럼 매달 나가는 돈을 추가해 보세요. 달마다 완료 여부를 체크할 수 있어요.</p>`}

function addFixedTx(r, amount, date){

}

const curYm = () => { const n = new Date(); return `${n.getFullYear()}-${pad(n.getMonth()+1)}`; };
const addMonths = (k, n) => { let [y,m] = k.split('-').map(Number); m += n; while(m > 12){ m -= 12; y++; } return `${y}-${pad(m)}`; };
const monthsBetween = (a, b) => { const [y1,m1] = a.split('-').map(Number), [y2,m2] = b.split('-').map(Number); return (y2-y1)*12 + (m2-m1); };
const estInterest = x => Math.round((x.loan||0) * (x.loanRate||0) / 1200);
// 매달 원금 목표 기준 자동 계산: 완납 시점, 남은 이자, 이번 달·누적 달성도
function loanPlan(x){
  const G = x.loanMonthly||0, B = x.loan||0; if(!G) return null;
  const k = curYm(), mr = (x.loanRate||0)/1200, rp = x.repay||[];
  const paidThis = rp.filter(r=>r.date.startsWith(k)).reduce((s,r)=>s+r.principal,0);
  let b = B, interest = 0, off = 0;
  const step = amt => { interest += b*mr; b = Math.max(0, b-amt); };
  if(b > 0){ if(paidThis < G) step(G - paidThis); while(b > 0 && off < 1200){ off++; step(G); } }
  const start = x.goalStart || k;
  const elapsed = Math.max(1, monthsBetween(start, k) + 1);
  const actual = rp.filter(r=>r.date.slice(0,7) >= start).reduce((s,r)=>s+r.principal,0);
  return {G, paidThis, payoff: addMonths(k, off), months: off + (paidThis < G ? 1 : 0), interest: Math.round(interest), elapsed, expected: G*elapsed, actual, done: B <= 0};
}
// 대출 목표 → '고정·예산' 탭의 매달 항목으로 자동 연결
function syncLoanTemplate(x){
  const id = 'loan-' + x.id; const exist = S.recurring.find(r=>r.id===id);
  if(!x.loanMonthly || (!x.loan && !exist)){ if(exist){ S.recurring = S.recurring.filter(r=>r.id!==id); touchMeta(); } return; }
  const o = {id, loanId:x.id, name:`${x.name} 대출 상환`, amount:x.loanMonthly + estInterest(x), day:x.repayDay||25, cat:'대출상환',
    method:S.methods.includes('계좌이체') ? '계좌이체' : (S.methods[0]||''), vary:true, start:(exist && exist.start) || curYm(), end: x.loan > 0 ? '' : curYm()};
  if(!S.cats.expense.includes('대출상환')) S.cats.expense.push('대출상환');
  if(!S.fixedCats.includes('대출상환')) S.fixedCats.push('대출상환');
  S.recurring = exist ? S.recurring.map(r=>r.id===id?o:r) : [...S.recurring, o];
  touchMeta();
}
function loanLines(x, repaid, loanStart){
  const pl = loanPlan(x);
  let h = `<small>대출 ${won(x.loan)}원${x.loanRate?` · 연 ${x.loanRate}%`:''}${loanStart?` · 지금까지 ${short(repaid)} 상환 (${Math.round(repaid/loanStart*100)}%)`:''}</small>`;
  if(!pl) return h + `<small>매달 원금 상환 목표를 정하면 완납 시점을 계산해 드려요 (항목을 눌러 입력)</small>`;
  if(pl.done) return h + `<small style="color:var(--accent)">🎉 완납했어요</small>`;
  const [py, pm] = pl.payoff.split('-');
  const gap = pl.actual - pl.expected;
  return h + `<small>목표 월 ${short(pl.G)} → <span style="color:var(--ink);font-weight:600">${py}년 ${+pm}월 완납 예정</span> (약 ${pl.months}개월${pl.interest?` · 남은 이자 약 ${short(pl.interest)}`:''})</small>
    <small>이번 달 원금 ${won(pl.paidThis)} / ${won(pl.G)} · 목표 시작 후 ${pl.elapsed}개월 누적 ${gap===0?'<span style="color:var(--accent)">목표대로 진행 중</span>':gap>0?`<span style="color:var(--accent)">목표보다 ${short(gap)} 앞섬</span>`:`<span class="exp">목표보다 ${short(-gap)} 부족</span>`}</small>
    <div class="loanbar" title="이번 달 목표 달성"><div style="width:${Math.min(100, pl.paidThis/pl.G*100)}%"></div></div>`;
}

function nextPay(day){
  if(!day) return null;
  const t0 = today0(); let y = t0.getFullYear(), m = t0.getMonth();
  let d = new Date(y, m, Math.min(day, dim(y, m+1)));
  if(d < t0){ m++; if(m > 11){ m = 0; y++; } d = new Date(y, m, Math.min(day, dim(y, m+1))); }
  return {date: d, dd: Math.round((d - t0)/864e5)};
}

/* ================= 백업 · 동기화 (AES-GCM 암호화) ================= */
function b64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
let keyCache = {pw:null, salt:null, key:null};
async function encryptPayload(pw, payload){
  if(keyCache.pw !== pw){ const salt = crypto.getRandomValues(new Uint8Array(16)); keyCache = {pw, salt, key: await deriveKey(pw, salt)}; }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, keyCache.key, new TextEncoder().encode(JSON.stringify(payload)));
  return {format:'household-ledger-backup', v:1, enc:true, salt:b64(keyCache.salt), iv:b64(iv), data:b64(new Uint8Array(ct))};
}
let prepared = null;
const canShareFile = f => !!(navigator.canShare && navigator.share && navigator.canShare({files:[f]}));
async function prepareSync(){
  prepared = null;
  const btn = $('#syncSend'); const pw = getSyncPw();
  if(!btn || !pw) return;
  btn.disabled = true; btn.textContent = '준비 중…';
  try{
    if(!(window.crypto && crypto.subtle)) throw new Error('nocrypto');
    const out = await encryptPayload(pw, {...S, savedAt: Date.now()});
    const n = new Date();
    prepared = new File([JSON.stringify(out)], `Purse동기화_${dstr(n)}_${pad(n.getHours())}${pad(n.getMinutes())}.json`, {type:'application/json'});
    if($('#syncSend') === btn){ btn.disabled = false; btn.textContent = canShareFile(prepared) ? '보내기 (AirDrop)' : '동기화 파일 저장'; }
  }catch(e){
    if($('#syncSend') === btn) btn.textContent = e.message==='nocrypto' ? 'https 주소에서 열어야 해요' : '준비 실패';
  }
}
function sendSync(){
  const f = prepared; if(!f) return;
  const done = () => { S.lastSent = S.lastBackup = Date.now(); save(); renderSettings(); };
  if(canShareFile(f)){
    navigator.share({files:[f], title:'Purse 동기화'})
      .then(() => { done(); toast('보냈어요. 받는 기기에서 "받은 파일 불러오기"를 누르세요'); })
      .catch(err => { if(err && err.name !== 'AbortError') toast('공유하지 못했어요. 다시 눌러 주세요'); });
  } else {
    const url = URL.createObjectURL(f); const a = document.createElement('a'); a.href = url; a.download = f.name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 2000);
    done(); toast('동기화 파일을 저장했어요');
  }
}
async function exportBackup(){
  const pw = $('#bkPw').value;
  const payload = {...S, savedAt: Date.now()};
  let out;
  if(pw){

/* 병합: 같은 항목은 더 최근 수정본, 지운 항목은 지운 대로 */
function cleanTx(t){
  if(!t || typeof t.id!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(t.date) || !['income','expense'].includes(t.type) || !Number.isFinite(+t.amount)) return null;
  const o = {id:t.id.slice(0,40), type:t.type, amount:Math.abs(Math.round(+t.amount)), date:t.date, cat:str(t.cat||'기타',30),
    method:str(t.method,30), memo:str(t.memo,80), created:num(t.created), updated:num(t.updated)};
  if(o.type === 'expense'){ o.kind = t.kind==='fixed' ? 'fixed' : 'variable'; if(t.paid){ o.paid = true; o.paidAt = num(t.paidAt); } }
  if(typeof t.rid === 'string') o.rid = t.rid.slice(0,40);
  return o;
}
const okId = x => x && typeof x.id === 'string' ? x.id.slice(0,40) : null;
const okDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
const cleanAsset = {
  cash: x => { const id = okId(x); return id && {id, name:str(x.name), bank:str(x.bank), balance:num(x.balance), updated:num(x.updated)}; },
  savings: x => { const id = okId(x); return id && {id, name:str(x.name), bank:str(x.bank), type:x.type==='적금'?'적금':'예금', balance:num(x.balance), monthly:num(x.monthly), rate:num(x.rate), maturity:okDate(x.maturity), updated:num(x.updated)}; },
  stocks: x => { const id = okId(x); return id && {id, name:str(x.name), account:str(x.account), qty:num(x.qty), avg:num(x.avg), price:num(x.price), updated:num(x.updated)}; },
  use: x => { const id = okId(x); return id && {id, name:str(x.name), type:['집','차','기타'].includes(x.type)?x.type:'기타', buyPrice:num(x.buyPrice), value:num(x.value), valueDate:okDate(x.valueDate),
    loan:num(x.loan), loanRate:num(x.loanRate), loanMonthly:num(x.loanMonthly), repayDay:Math.min(31,Math.round(num(x.repayDay))), goalStart:/^\d{4}-\d{2}$/.test(x.goalStart)?x.goalStart:'',
    repay:(Array.isArray(x.repay)?x.repay:[]).filter(r=>r&&typeof r.id==='string').map(r=>({id:r.id.slice(0,40), date:okDate(r.date), principal:num(r.principal), interest:num(r.interest), txId:typeof r.txId==='string'?r.txId.slice(0,40):null})), updated:num(x.updated)}; }
};
function mergeList(local, inc, del, clean){
  const map = new Map(local.map(x => [x.id, x])); let a = 0, u = 0;
  for(const raw of (Array.isArray(inc) ? inc : [])){
    const x = clean(raw); if(!x) continue;
    const e = map.get(x.id);
    if(!e){ map.set(x.id, x); a++; } else if((x.updated||0) > (e.updated||0)){ map.set(x.id, x); u++; }
  }
  for(const [id, ts] of Object.entries(del)){ const x = map.get(id); if(x && (x.updated||0) <= ts) map.delete(id); }
  return {list: [...map.values()], a, u};
}
const strArr = (a, n=20) => [...new Set((Array.isArray(a) ? a : []).map(x => str(x, n)).filter(Boolean))];
function merge(inc){
  const hadMeta = inc && +inc.metaAt > 0;
  inc = migrate(inc);
  const del = {...S.deleted};
  for(const [k,v] of Object.entries(inc.deleted||{})) if(typeof v==='number' && (!del[k] || del[k]<v)) del[k]=v;
  const r = mergeList(S.tx, inc.tx, del, cleanTx); S.tx = r.list;
  let assetsChanged = 0;
  for(const k of Object.keys(cleanAsset)){ const m = mergeList(S.assets[k], inc.assets[k], del, cleanAsset[k]); S.assets[k] = m.list; assetsChanged += m.a + m.u; }
  S.deleted = del;
  if(hadMeta && +inc.metaAt > (S.metaAt||0)){
    const ce = strArr(inc.cats.expense), ci = strArr(inc.cats.income);
    if(ce.length) S.cats.expense = ce; if(ci.length) S.cats.income = ci;
    S.fixedCats = strArr(inc.fixedCats); S.methods = strArr(inc.methods);
    S.cards = (Array.isArray(inc.cards)?inc.cards:[]).filter(c=>c&&c.name).map(c=>({name:str(c.name,20), payDay:Math.min(31,Math.max(0,Math.round(num(c.payDay))))}));
    S.recurring = (Array.isArray(inc.recurring)?inc.recurring:[]).map(x=>{ const id = okId(x); return id && {id, name:str(x.name), amount:Math.abs(Math.round(num(x.amount))), day:Math.min(31,Math.max(1,Math.round(num(x.day))||1)), cat:str(x.cat,30), method:str(x.method,30), vary:!!x.vary, loanId:typeof x.loanId==='string'?x.loanId.slice(0,40):undefined, start:/^\d{4}-\d{2}$/.test(x.start)?x.start:'', end:/^\d{4}-\d{2}$/.test(x.end)?x.end:''}; }).filter(Boolean);
    S.metaAt = +inc.metaAt;
  } else if(!hadMeta){
    S.cats.expense = strArr([...S.cats.expense, ...strArr(inc.cats.expense)]);
    S.cats.income = strArr([...S.cats.income, ...strArr(inc.cats.income)]);
    S.methods = strArr([...S.methods, ...strArr(inc.methods)]);
    for(const c of (Array.isArray(inc.cards)?inc.cards:[])) if(c && c.name && !isCard(c.name)) S.cards.push({name:str(c.name,20), payDay:0});
  }
  if((+inc.budgetsAt||0) > (S.budgetsAt||0) && inc.budgets && typeof inc.budgets==='object'){
    S.budgets = {}; for(const [k,v] of Object.entries(inc.budgets)) if(Number.isFinite(+v) && +v>0) S.budgets[k]=Math.round(+v);
    S.budgetsAt = +inc.budgetsAt;
  }
  const isB64 = v => typeof v === 'string' && /^[A-Za-z0-9+/=]+$/.test(v);
  if(inc.secret && isB64(inc.secret.salt) && isB64(inc.secret.iv) && isB64(inc.secret.data) && num(inc.secret.at) > ((S.secret && S.secret.at) || 0)){
    S.secret = {salt:inc.secret.salt, iv:inc.secret.iv, data:inc.secret.data, at:num(inc.secret.at)};
    secretKey = null; secretData = null; if(view === 'secret') view = 'list';
  }
  return {added:r.a, updated:r.u, assetsChanged};
}
async function importBackup(file){
  let obj;
  try{ obj = JSON.parse(await file.text()); }catch(e){ toast('Purse 백업 파일이 아니에요'); return; }
  if(!obj || obj.format!=='household-ledger-backup'){ toast('Purse 백업 파일이 아니에요'); return; }
  let data;
  if(obj.enc){
    const pws = [...new Set([($('#bkPw')||{}).value, getSyncPw()].filter(Boolean))];
    if(!pws.length){ toast('암호화된 파일이에요. 동기화 비밀번호를 먼저 설정하세요'); return; }
    if(!(window.crypto && crypto.subtle)){ toast('이 환경에선 복호화를 쓸 수 없어요 (https 주소에서 열어주세요)'); return; }
    for(const pw of pws){
      try{
        const key = await deriveKey(pw, unb64(obj.salt));
        const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(obj.iv)}, key, unb64(obj.data));
        data = JSON.parse(new TextDecoder().decode(pt)); break;
      }catch(e){}
    }
    if(!data){ toast('비밀번호가 맞지 않아요. 두 기기의 동기화 비밀번호가 같은지 확인하세요'); return; }
  } else data = obj.data;
  const savedAt = data && data.savedAt;
  const r = merge(data || {}); S.lastReceived = Date.now(); save(); render();
  const when = savedAt ? new Date(savedAt).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'에 만든 파일 · ' : '';
  toast(`${when}새 내역 ${r.added}건, 수정 ${r.updated}건${r.assetsChanged?`, 자산 ${r.assetsChanged}건`:''} 반영`);
}

   가계부 합계·통계·자산·내보내기에 포함되지 않고, 비밀번호로 암호화되어 저장됨 */

const SEC_DEFAULT = () => ({pockets:[{id:'pk-allowance', name:'용돈', goal:0}, {id:'pk-emergency', name:'비상금', goal:0}], entries:[]});
async function unlockSecret(pin){
  if(!S.secret){
    const salt = crypto.getRandomValues(new Uint8Array(16));
    secretKey = {key: await deriveKey(pin, salt), salt}; secretData = SEC_DEFAULT(); await saveSecret(); return true;
  }
  try{
    const salt = unb64(S.secret.salt), key = await deriveKey(pin, salt);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(S.secret.iv)}, key, unb64(S.secret.data));
    const d = JSON.parse(new TextDecoder().decode(pt));
    secretData = {pockets: Array.isArray(d.pockets) ? d.pockets : [], entries: Array.isArray(d.entries) ? d.entries : []};
    secretKey = {key, salt}; return true;
  }catch(e){ return false; }
}
async function saveSecret(){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, secretKey.key, new TextEncoder().encode(JSON.stringify(secretData)));
  S.secret = {salt:b64(secretKey.salt), iv:b64(iv), data:b64(new Uint8Array(ct)), at:Date.now()}; save();
}

/* ================= 이벤트 ================= */
document.addEventListener('click', e => {
  const el = sel => e.target.closest(sel);
  let b;
  if((b = el('[data-view]'))){ if(view === 'secret') lockSecret(); view = b.dataset.view; if(view !== 'cards') selIds.clear(); render(); window.scrollTo(0,0); return; }
  if(el('#prev')){ if(--M<1){M=12;Y--;} render(); return; }
  if(el('#next')){ if(++M>12){M=1;Y++;} render(); return; }
  if(el('#monthLabel')){ if(lpFired){ lpFired = false; return; } const n=new Date(); Y=n.getFullYear(); M=n.getMonth()+1; render(); return; }
  if(el('#fab')){ if(view === 'assets') return; openTx(); return; }
  if(el('[data-close]')){ closeSheet(); return; }
  if((b = el('[data-edit]'))){ const t = S.tx.find(x=>x.id===b.dataset.edit); if(t) openTx(t); return; }
  if((b = el('[data-filt]'))){ filt = b.dataset.filt; document.querySelectorAll('[data-filt]').forEach(x=>x.classList.toggle('on', x===b)); renderListBody(); return; }
  if((b = el('[data-fxck]'))){
    const r = S.recurring.find(x=>x.id===b.dataset.fxck); if(!r) return;
    const t = recTx(r);
    if(t){
      if(!confirm(`${r.name} 완료를 취소할까요? 가계부 내역에서도 지워져요.${r.loanId?'\n대출 잔액도 되돌아가요.':''}`)) return;
      S.tx = S.tx.filter(x=>x.id!==t.id); S.deleted[t.id] = Date.now();
      if(r.loanId){ const a = S.assets.use.find(x=>x.id===r.loanId); const rec = a && (a.repay||[]).find(x=>x.txId===t.id);
        if(rec){ const o = {...a, loan:(a.loan||0)+rec.principal, repay:a.repay.filter(x=>x!==rec), updated:Date.now()}; S.assets.use = S.assets.use.map(x=>x.id===o.id?o:x); syncLoanTemplate(o); } }
      save(); render(); return;
    }
    if(r.loanId){ const a = S.assets.use.find(x=>x.id===r.loanId); if(a) openRepay(a, r.id); return; }
    if(r.vary){ openFxPay(r); return; }
    addFixedTx(r, r.amount, recDue(r)); save(); render(); toast(`${r.name} 완료`); return;
  }
  if((b = el('[data-fxedit]'))){
    const r = S.recurring.find(x=>x.id===b.dataset.fxedit); if(!r) return;
    const t = recTx(r);
    if(t){ openTx(t); return; }
    if(r.loanId){ const a = S.assets.use.find(x=>x.id===r.loanId); if(a){ openAsset('use', a); return; } }
    openRec(r); return;
  }
  if(el('#recDoneAll')){
    const list = activeRec().filter(r => !recTx(r) && !r.vary);
    if(!confirm(`금액이 고정된 ${list.length}건을 모두 완료 처리할까요?`)) return;
    for(const r of list) addFixedTx(r, r.amount, recDue(r));
    save(); render(); toast(`${list.length}건 완료`); return;
  }
  // 숨김 지갑
  if(el('#secLock')){ lockSecret(); toast('잠갔어요'); return; }
  if(el('#secNew')){ openSec(); return; }
  if((b = el('[data-secadd]'))){ openSec(null, b.dataset.secadd, b.dataset.st); return; }
  if((b = el('[data-sty]'))){ ctx.type = b.dataset.sty; setStSeg(); return; }
  if((b = el('[data-secsel]'))){ secSel = b.dataset.secsel || null; render(); return; }
  if((b = el('[data-secedit]'))){ const x = secretData && secretData.entries.find(e=>e.id===b.dataset.secedit); if(x) openSec(x); return; }
  if((b = el('[data-pocketedit]'))){ const p = secretData.pockets.find(x=>x.id===b.dataset.pocketedit); if(p) openPocket(p); return; }
  if(el('#pocketNew')){ openPocket(); return; }
  if(el('#secPin')){ openNewPin(); return; }
  if(el('#sDel')){ if(!confirm('이 기록을 삭제할까요?')) return; secretData.entries = secretData.entries.filter(e=>e.id!==ctx.id); saveSecret().then(()=>{ closeSheet(); render(); }); return; }
  if(el('#pDel')){
    const n = secretData.entries.filter(e=>e.pocket===ctx.id).length;
    if(!confirm(`이 주머니를 삭제할까요?${n?` 기록 ${n}건도 함께 지워져요.`:''}`)) return;
    secretData.pockets = secretData.pockets.filter(p=>p.id!==ctx.id); secretData.entries = secretData.entries.filter(e=>e.pocket!==ctx.id);
    if(secSel === ctx.id) secSel = null; saveSecret().then(()=>{ closeSheet(); render(); }); return;
  }
  if(el('#secReset')){
    if(!confirm('숨김 지갑의 모든 내용을 지울까요? 되돌릴 수 없어요.') || !confirm('정말 지울까요?')) return;
    S.secret = null; save(); lockSecret(); toast('숨김 지갑을 초기화했어요'); return;
  }
  // 내역 시트
  if((b = el('[data-ft]'))){ formType = b.dataset.ft; kindManual = false; fillTxChips(null, radioVal('fMethod')); return; }
  if((b = el('[data-fk]'))){ formKind = b.dataset.fk; kindManual = true; setKindSeg(); return; }
  if(el('#fCatAdd')){
    const n = (prompt(`새 ${formType==='expense'?'지출':'수입'} 카테고리 이름`) || '').trim().slice(0,20);
    if(!n) return;
    if(!S.cats[formType].includes(n)){ S.cats[formType].push(n); touchMeta(); save(); }
    kindManual = false; fillTxChips(n, radioVal('fMethod')); return;
  }
  if(el('#fDel')){
    if(!editing || !confirm('이 내역을 삭제할까요?')) return;
    const id = editing.id; S.tx = S.tx.filter(t=>t.id!==id); S.deleted[id] = Date.now();
    save(); closeSheet(); render(); toast('삭제했어요'); return;
  }
  // 자산
  if((b = el('[data-anew]'))){ openAsset(b.dataset.anew); return; }
  if((b = el('[data-aedit]'))){ const [k,id] = b.dataset.aedit.split(':'); const x = S.assets[k].find(a=>a.id===id); if(x) openAsset(k, x); return; }
  if((b = el('[data-repay]'))){ const x = S.assets.use.find(a=>a.id===b.dataset.repay); if(x) openRepay(x); return; }
  if(el('#aDel')){
    const {kind, id} = ctx; if(!confirm('이 항목을 삭제할까요?')) return;
    S.assets[kind] = S.assets[kind].filter(x=>x.id!==id); S.deleted[id] = Date.now();
    if(kind === 'use' && S.recurring.some(r=>r.loanId===id)){ S.recurring = S.recurring.filter(r=>r.loanId!==id); touchMeta(); }
    save(); closeSheet(); render(); toast('삭제했어요'); return;
  }
  if((b = el('[data-delrepay]'))){
    const item = S.assets.use.find(x=>x.id===ctx.id); if(!item) return;
    const r = (item.repay||[]).find(x=>x.id===b.dataset.delrepay); if(!r || !confirm('이 상환 기록을 지울까요? 대출 잔액이 되돌아가요.\n(가계부에 기록된 지출은 내역에서 따로 지워 주세요)')) return;
    const o = {...item, loan:(item.loan||0)+r.principal, repay:item.repay.filter(x=>x.id!==r.id), updated:Date.now()};
    S.assets.use = S.assets.use.map(x=>x.id===o.id?o:x); save(); render(); openAsset('use', o); return;
  }
  // 카드
  if((b = el('[data-csel]'))){ cardSel = b.dataset.csel; selIds.clear(); render(); return; }
  if(el('#selAll')){
    const ids = [...document.querySelectorAll('[data-sel]')].map(x=>x.dataset.sel);
    const all = ids.length && ids.every(id=>selIds.has(id));
    selIds.clear(); if(!all) ids.forEach(id=>selIds.add(id)); render(); return;
  }
  if(el('#payDone')){
    const now = Date.now(); const n = selIds.size;
    for(const t of S.tx) if(selIds.has(t.id)){ t.paid = true; t.paidAt = now; t.updated = now; }
    selIds.clear(); save(); render(); toast(`${n}건 선납 완료 처리했어요`); return;
  }
  if((b = el('[data-unpay]'))){
    const t = S.tx.find(x=>x.id===b.dataset.unpay); if(!t) return;
    t.paid = false; delete t.paidAt; t.updated = Date.now(); save(); render(); toast('선납 완료를 취소했어요'); return;
  }
  // 설정
  if((b = el('[data-cattab]'))){ catTab = b.dataset.cattab; renderSettings(); return; }
  if((b = el('[data-fixtog]'))){
    const c = b.dataset.fixtog; S.fixedCats = S.fixedCats.includes(c) ? S.fixedCats.filter(x=>x!==c) : [...S.fixedCats, c];
    touchMeta(); save(); renderSettings(); return;
  }
  if((b = el('[data-move]'))){
    const list = S.cats[b.dataset.move], i = +b.dataset.idx, j = i + (+b.dataset.dir);
    if(j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]]; touchMeta(); save(); renderSettings(); return;
  }
  if((b = el('[data-delcat]'))){
    const key = b.dataset.delcat, name = b.dataset.name;
    const list = key==='methods' ? S.methods : S.cats[key];
    if(key !== 'methods' && list.length <= 1){ toast('최소 하나는 남겨야 해요'); return; }
    if(!confirm(`'${name}'을(를) 목록에서 뺄까요? (기존 내역은 그대로 남아요)`)) return;
    list.splice(list.indexOf(name), 1); if(key==='expense') S.fixedCats = S.fixedCats.filter(c=>c!==name);
    touchMeta(); save(); renderSettings(); return;
  }
  if((b = el('[data-delcard]'))){
    const i = +b.dataset.delcard; const c = S.cards[i];
    if(!confirm(`'${c.name}'을(를) 카드 목록에서 뺄까요? (기존 내역은 그대로 남지만 선납 목록에서는 빠져요)`)) return;
    S.cards.splice(i, 1); if(cardSel === c.name) cardSel = 'all'; touchMeta(); save(); renderSettings(); return;
  }
  if(el('#recNew')){ openRec(); return; }
  if((b = el('[data-recedit]'))){ const r = S.recurring.find(x=>x.id===b.dataset.recedit); if(r) openRec(r); return; }
  if(el('#rcDel')){
    if(!confirm('이 고정지출 항목을 목록에서 지울까요? (이미 완료된 달의 내역은 남아요)\n끝난 항목이라면 지우지 말고 \'끝나는 달\'을 정하는 걸 추천해요.')) return;
    S.recurring = S.recurring.filter(r=>r.id!==ctx.id); touchMeta(); save(); closeSheet(); render(); return;
  }
  if(el('#syncSend')){ sendSync(); return; }
  if(el('#syncPwReset')){ if(confirm('동기화 비밀번호를 다시 설정할까요? 다른 기기도 같은 비밀번호로 바꿔야 해요.')){ setSyncPw(''); keyCache = {pw:null}; renderSettings(); } return; }
  if(el('#exportBtn')){ exportBackup().catch(()=>toast('백업 중 오류가 났어요')); return; }
  if(el('#csvMonth')){ exportCSV(false); return; }
  if(el('#csvAll')){ exportCSV(true); return; }
  if(el('#wipe')){
    if(!confirm('이 기기의 모든 데이터를 삭제할까요?')) return;
    if(!confirm('정말 삭제할까요? 되돌릴 수 없어요.')) return;
    try{ localStorage.removeItem(KEY); }catch(_){}
    S = fresh(); view = 'list'; render(); toast('모두 삭제했어요');
  }
});
document.addEventListener('submit', e => {
  if(e.target.id === 'syncPwForm'){
    e.preventDefault(); const v = $('#syncPw').value;
    if(v.length < 6){ toast('6자 이상으로 정해 주세요'); return; }
    setSyncPw(v); renderSettings(); toast('설정했어요. 다른 기기에도 같은 비밀번호를 설정하세요'); return;
  }
  const f = e.target.closest('form[data-addcat]'); if(!f) return;
  e.preventDefault();
  const name = f.querySelector('input').value.trim().slice(0,20);
  if(!name) return;
  const key = f.dataset.addcat;
  if(key === 'cards' || key === 'methods'){
    if(allMethods().includes(name)){ toast('이미 있는 이름이에요'); return; }
    if(key === 'cards') S.cards.push({name, payDay:0}); else S.methods.push(name);
  } else {
    if(S.cats[key].includes(name)){ toast('이미 있는 항목이에요'); return; }
    S.cats[key].push(name);
  }
  touchMeta(); save(); renderSettings();
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'q'){ q = t.value; renderListBody(); return; }
  if(t.id === 'fAmt' || t.dataset.budget !== undefined || t.dataset.money !== undefined){
    const d = String(t.value).replace(/\D/g,'').slice(0,13);
    t.value = d ? Number(d).toLocaleString('ko-KR') : '';
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.budget !== undefined){
    const v = digits(t.value);
    if(v) S.budgets[t.dataset.budget] = v; else delete S.budgets[t.dataset.budget];
    S.budgetsAt = Date.now(); save(); render(); return;
  }
  if(t.dataset.rename !== undefined){ renameCat(t.dataset.rename, t.dataset.old, t.value); return; }
  if(t.dataset.cardname !== undefined){ renameCard(+t.dataset.cardname, t.value); return; }
  if(t.dataset.payday !== undefined){ S.cards[+t.dataset.payday].payDay = +t.value; touchMeta(); save(); return; }
  if(t.dataset.sel !== undefined){ t.checked ? selIds.add(t.dataset.sel) : selIds.delete(t.dataset.sel); renderSelbar(); return; }
  if(t.name === 'fCat' && !kindManual && formType === 'expense'){ formKind = S.fixedCats.includes(t.value) ? 'fixed' : 'variable'; setKindSeg(); return; }
  if(t.name === 'fMethod'){ updatePaidVis(); return; }
  if((t.id==='importFile' || t.id==='syncFile') && t.files[0]){ importBackup(t.files[0]); t.value=''; }
});
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target.matches && e.target.matches('[data-rename],[data-cardname]')){ e.preventDefault(); e.target.blur(); return; }
  if(e.key==='Escape' && !$('#sheet').hidden){ closeSheet(); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!typing && $('#sheet').hidden && (e.key==='n' || e.key==='+') && !e.metaKey && !e.ctrlKey && view !== 'assets'){ e.preventDefault(); openTx(); }
});
window.addEventListener('storage', e => { if(e.key===KEY){ S = load(); render(); } });

save(); // 이전 버전 데이터를 새 구조로 저장
render();
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
