<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 외부로 어떤 네트워크 요청도 못 보내도록 차단 (데이터 유출 방지) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob:; connect-src 'none'; form-action 'none';">
<meta name="theme-color" content="#1f6f5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Purse">
<title>Purse</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#f4f2ec;--card:#fff;--ink:#1c2420;--muted:#6d746f;--line:#e4e0d6;--accent:#1f6f5c;--accent-ink:#fff;--exp:#c2492f;--inc:#2563a8;--soft:#eef3f0;--r:14px;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--card:#1b211e;--ink:#e8ece9;--muted:#9aa39e;--line:#2b332f;--accent:#4fb393;--accent-ink:#0d1411;--exp:#ef7f66;--inc:#6ea8ef;--soft:#1f2a25}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.app{max-width:960px;margin:0 auto;padding:0 16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 0 8px}
.month{display:flex;align-items:center;gap:2px}
.month h1{font-size:20px;margin:0 6px;font-weight:700;letter-spacing:-.02em;cursor:pointer;white-space:nowrap;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.icon{border:0;background:transparent;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:22px;line-height:1;flex:none}
.icon:hover{background:var(--soft)}
.icon.sm{width:32px;height:32px;font-size:15px;color:var(--muted)}
.sync-btn{order:3;color:var(--accent)}.sync-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
#summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sum span{display:block;font-size:12px;color:var(--muted)}
.sum b{display:block;font-size:clamp(15px,4.2vw,22px);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum small{display:block;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.4}
.inc{color:var(--inc)}.exp{color:var(--exp)}.up{color:var(--exp)}.down{color:var(--inc)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav.tabs button{flex:1;border:0;background:none;padding:10px 0 12px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent);font-weight:600}
.fab{position:fixed;right:max(18px,calc(50% - 462px));bottom:calc(90px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;z-index:11}
.fab[hidden],[hidden]{display:none!important}
.toolbar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:150px}
input[type=search],input[type=text],input[type=password],input[type=date],.field input,.inline input,.budget-row input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:8px 13px;border-radius:8px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.day.card{padding:0;overflow:hidden;margin-bottom:10px}
.day-head{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;cursor:pointer}
.item+.item{border-top:1px solid var(--line)}
.item:hover,.arow:hover{background:var(--soft)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.mid{flex:1;min-width:0}
.mid b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid small{color:var(--muted);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.amt small{display:block;font-size:12px;font-weight:500}
.tagk{font-size:10.5px;padding:1px 6px;border-radius:999px;background:var(--soft);color:var(--accent);margin-left:6px;vertical-align:1px;font-weight:600}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet-panel{position:relative;background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-head h2{font-size:18px;margin:0}
.amount-field{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);margin:14px 0}
.amount-field input{flex:1;min-width:0;border:0;background:none;font-size:32px;font-weight:700;padding:6px 0;outline:none;text-align:right;font-variant-numeric:tabular-nums}
.amount-field:focus-within{border-color:var(--accent)}
.field{display:block;margin:14px 0}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input{width:100%}
.ck{display:flex;align-items:center;gap:10px;margin:14px 0;font-size:15px;cursor:pointer}
.ck input,.ck-row input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span,.tag,.chip-add{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;font-size:14px;cursor:pointer;background:var(--card)}
.chip-add{border-style:dashed;color:var(--muted)}
.chip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tag{cursor:default}
.tag button{border:0;background:none;padding:0 0 0 2px;cursor:pointer;color:var(--muted);font-size:17px;line-height:1}
.actions{display:flex;gap:8px;margin-top:18px}
.btn{border:1px solid var(--line);background:var(--card);padding:11px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-size:15px;white-space:nowrap}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions .btn.primary{flex:1}
.btn.danger{color:var(--exp)}
.btn:disabled{opacity:.55;cursor:default}
.inline{display:flex;gap:6px;margin-top:10px}.inline input{flex:1;min-width:0}
section.card{margin-bottom:12px}
section.card h3{margin:0 0 10px;font-size:15px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.sec-head h3{margin:0!important}
.sec-head h3 small{color:var(--muted);font-weight:500;margin-left:6px;font-size:13px}
.note{font-size:13px;color:var(--muted);line-height:1.65;margin:6px 0}
.empty{color:var(--muted);text-align:center;padding:24px 0;margin:0;font-size:14px}
.bar-row{margin:12px 0}
.bar-label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:8px}
.bar-label em{font-style:normal;color:var(--muted);font-size:12px;margin-left:4px}
.bar-label .dot{margin-right:6px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar>div{height:100%;border-radius:4px}
.bar.over>div{background:var(--exp)!important}
.trend{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.tcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.tbars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.tb{width:40%;max-width:20px;border-radius:4px 4px 0 0;min-height:2px}
.inc-bg{background:var(--inc)}.exp-bg{background:var(--exp)}
.tcol small{font-size:12px;color:var(--muted);margin-top:6px}
.tcol.cur small{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.budget-row{display:grid;grid-template-columns:1fr 140px;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.budget-row input{width:100%;text-align:right;padding:8px 10px}
.budget-row .bar{grid-column:1/-1}
.budget-row small{color:var(--muted);font-size:12px}
.banner{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;align-items:center;line-height:1.5}
.banner button{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.file-btn{position:relative;overflow:hidden;display:inline-block}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pw{width:100%;margin-top:4px}
/* 자산 */
.big{font-size:30px;font-weight:700;display:block;margin:2px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted);font-size:13px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--soft);margin:14px 0 10px}
.stack div{height:100%}
.alloc{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 16px;font-size:13px}
.alloc div{display:flex;justify-content:space-between;gap:6px}
.alloc span{color:var(--muted)}
.arow{display:flex;gap:12px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:11px 4px;text-align:left;cursor:pointer;border-radius:0}
.arow .mid small{white-space:normal;line-height:1.5}
.loanbar{height:5px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:6px}
.loanbar div{height:100%;background:var(--accent)}
.hist-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;border-top:1px dashed var(--line)}
/* 고정지출 */
.fx-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line)}
.fx-ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--accent-ink);font-weight:700;cursor:pointer;flex:none;font-size:16px;line-height:1;padding:0}
.fx-row.done .fx-ck{background:var(--accent);border-color:var(--accent)}
.fx-body{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:none;padding:12px 0;text-align:left;cursor:pointer}
.fx-row.done .mid b{color:var(--muted)}
.muted small,.amt small.muted{color:var(--muted)}
.cmp{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.cmp th{font-weight:500;color:var(--muted);font-size:12px;text-align:right;padding:4px 0 6px}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:9px 0;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.cmp tr.total td{font-weight:700;border-top:2px solid var(--line)}
.cmp td small{display:block;font-size:11px;font-weight:500}
.bar.dual{position:relative;overflow:visible;margin:2px 0 4px}
.bar.dual>i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.bar-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:10px}
/* 카드 */
.ck-row{display:flex;gap:12px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:12;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:14px}
.selbar b{font-variant-numeric:tabular-nums}
.selbar .btn{background:var(--accent);color:var(--accent-ink);border:0}
.card-line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
/* 설정: 카테고리 편집 */
.cat-row{display:flex;align-items:center;gap:4px;padding:4px 0;border-top:1px solid var(--line)}
.cat-row input{flex:1;min-width:0;border:1px solid transparent;background:transparent;padding:8px;border-radius:8px;font-size:16px}
.cat-row input:focus{border-color:var(--accent);background:var(--card)}
.cat-row select{padding:6px 8px;font-size:14px}
.kind-tog{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.kind-tog.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
@media (min-width:820px){
  nav.tabs button{font-size:12.5px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
  .grid2>section{margin-bottom:0}
  .sheet{align-items:center}
  .sheet-panel{border-radius:20px}
}
/* 하단 탭 바 (업무 도구 스타일) */
nav.tabs{justify-content:flex-start;box-shadow:0 -4px 16px rgba(0,0,0,.05);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 64px;max-width:110px;padding:7px 0 9px;gap:2px;white-space:nowrap}
nav.tabs svg{width:22px;height:22px;padding:4px 12px;box-sizing:content-box;border-radius:999px;transition:background .15s}
@media (min-width:1000px){nav.tabs{justify-content:center}}
.todaybar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;margin-bottom:12px;border-radius:12px;background:var(--soft);font-size:13.5px;color:var(--muted)}
.todaybar b{color:var(--ink)}
.todaybar.away{background:#fff4e0;border:1px solid #f0d199}
@media (prefers-color-scheme:dark){.todaybar.away{background:#3a3020;border-color:#6b5525}}
/* 보험 */
.ins-cov{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr) 32px;gap:4px;align-items:center;padding:4px 0;border-top:1px solid var(--line)}
.ins-cov input,.ins-cov select{width:100%;min-width:0;padding:8px 6px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.gap{color:var(--exp);font-weight:600;font-size:12px}
.cmp td.c,.cmp th.c{text-align:right}
.payday{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;margin:8px 0;background:var(--soft);border-radius:12px;font-size:14px}
.payday b{font-size:15px}
nav.tabs button.on svg{background:var(--soft)}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
/* 분석 */
.hero .big{margin:4px 0 2px}
.hero .of{font-size:15px;color:var(--muted);font-weight:500}
.status{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.5;margin:8px 0 0}
.status i{font-style:normal}
.bar.pace{position:relative;overflow:visible;height:12px;border-radius:6px;margin:26px 0 4px}
.bar.pace>div{border-radius:6px}
.bar.pace>i{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
.bar.pace>em{position:absolute;top:-22px;transform:translateX(-50%);font-size:11px;color:var(--muted);font-style:normal;white-space:nowrap}
.kpi3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi3 .card{padding:12px}
.kpi3 span{display:block;font-size:12px;color:var(--muted)}
.kpi3 b{display:block;font-size:clamp(15px,4.2vw,22px);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi3 small{font-size:11px;color:var(--muted)}
.warn-row{padding:10px 0;border-top:1px solid var(--line)}
.warn-row:first-of-type{border-top:0}
.warn-row .bar-label b{font-weight:600}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.badge.over{background:#fde8e3;color:#b3402a}.badge.fast{background:#fdf1dc;color:#9a6a12}.badge.none{background:var(--soft);color:var(--muted)}
@media (prefers-color-scheme:dark){.badge.over{background:#4a2620;color:#ff9a85}.badge.fast{background:#4a3a1c;color:#f1c46b}}
.btrend{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:6px}
.btrend .tcol small.d{font-size:10.5px;margin-top:2px}
.tb.bud-bg,.bud-bg{background:var(--line)}
.bk-row{display:grid;grid-template-columns:1fr auto 120px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.bk-row small{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.bk-row input{width:100%;text-align:right;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:15px}
.bk-g{font-size:13px;font-weight:700;margin:14px 0 2px;color:var(--accent)}
.bk-total{display:flex;justify-content:space-between;font-weight:700;padding:10px 0;border-top:2px solid var(--line);margin-top:8px}

:root{--sav:#7a5cc2}
@media (prefers-color-scheme:dark){:root{--sav:#a98be8}}
.sav{color:var(--sav)}.sav-bg{background:var(--sav)}
#summary{grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px}
#summary .sum{padding:10px}
#summary .sum b{font-size:clamp(13px,3.7vw,22px)}
.cmp tr.sub td{font-weight:600;border-top:2px solid var(--line)}
.cmp td .tagk{margin-left:2px}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
.fundt td,.fundt th{padding:7px 6px 7px 0;font-size:13px}
.fundt td.memo{font-size:12px;color:var(--muted);white-space:normal;text-align:left;min-width:90px}
.fundt th:last-child{text-align:left}
.fundt tr.curm td{background:var(--soft)}
.fund{border-top:1px solid var(--line);padding:10px 0 6px}
.fund:first-of-type{border-top:0}
.fund .sec-head b{font-size:15px}
details summary{cursor:pointer;color:var(--accent);font-size:14px;margin:10px 0 4px;font-weight:600}
.grp{border-top:2px solid var(--line);padding-top:8px;margin-top:12px}
.grp-head{display:flex;gap:4px;align-items:center}
.grp-head input{flex:1;min-width:0;font-weight:700;border:1px solid transparent;background:transparent;padding:8px;border-radius:8px;font-size:16px}
.grp-head input:focus{border-color:var(--accent);background:var(--card)}
.cat-row select{max-width:110px}
.cat-row.wrap{flex-wrap:wrap}
.cat-row .tgt{flex:0 0 110px;text-align:right;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:15px}
.chip-grp{width:100%;font-size:12px;color:var(--muted);margin:6px 0 0}
.chip-grp:first-child{margin-top:0}
.ck-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:14px}
.ck-list label{display:flex;gap:6px;align-items:center}
.ck-list input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.grp-title{grid-column:1/-1;font-size:12px;color:var(--muted);margin:10px 0 2px;font-weight:600}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;background:var(--card);color:var(--ink);outline:none}
textarea:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.two input{width:100%;text-align:right}
.two .field{margin:8px 0}
.grp-sum{display:flex;justify-content:space-between;gap:8px;color:var(--ink)!important;font-size:15px!important;margin:0!important;list-style:none}
.grp-sum::-webkit-details-marker{display:none}
.grp-sum>span:first-child::before{content:"▸ ";color:var(--muted)}
details[open]>.grp-sum>span:first-child::before{content:"▾ "}
.grp-sum>span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
header.top{gap:6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:21px;letter-spacing:-.03em;color:var(--accent);flex:none}
.brand svg{width:32px;height:32px;border-radius:9px;box-shadow:0 2px 6px rgba(31,111,92,.25)}
header.top .month{margin-left:auto}
header.top .month h1{font-size:17px;margin:0 2px}
header.top .sync-btn{order:0}
@media (max-width:370px){.brand span{display:none}}
.nw .big{margin:2px 0}
.sch-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.sch-row:first-of-type{border-top:0}
.sch-row.done{opacity:.55}
.sch-d{width:34px;text-align:center;flex:none;line-height:1.1}
.sch-d b{display:block;font-size:17px}
.sch-d small{font-size:11px;color:var(--muted)}
.sec-head h3 small{font-size:12px;color:var(--muted);font-weight:500;margin-left:4px}
.pay-net{display:flex;flex-direction:column;padding:4px 0 10px}
.pay-net span{font-size:13px;color:var(--muted)}
.pay-net b{font-size:28px;font-variant-numeric:tabular-nums;margin:2px 0}
.pay-net small{font-size:12px;color:var(--muted)}
.pay-h{font-size:12px;font-weight:700;color:var(--accent);margin:10px 0 2px}
.pay-row{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:5px 0;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
.pay-row.tot{font-weight:700;border-top:1px solid var(--ink)}
.grid2.tight{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:520px){.grid2.tight{grid-template-columns:1fr;gap:4px}}
.pay-set{border:1px solid var(--line);border-radius:12px;padding:4px 12px 10px;margin:8px 0}
label.mini{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);white-space:nowrap}
label.mini input{width:16px;height:16px;accent-color:var(--accent)}
.cmp td small{color:var(--muted)}
.whoseg button{padding:7px 12px}
.who-bar{align-items:center;margin:0 0 10px}
.who-bar .muted{font-size:12px}
.own{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:#e8eefc;color:#2f55a8;margin-left:6px;vertical-align:1px}
@media (prefers-color-scheme:dark){.own{background:#22304d;color:#9db8f0}}
.cname{border:0;background:none;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.cname i{font-style:normal;color:var(--muted);font-size:12px;margin-left:4px}
.cname-edit{font:inherit;font-size:15px;padding:4px 8px;border:1px solid var(--accent);border-radius:8px;width:150px;background:var(--card);color:var(--ink)}
.ownsel{padding:5px 6px!important;font-size:13px!important;max-width:92px}
.bk-row.bk3{grid-template-columns:minmax(0,1fr) auto 120px}
.bk-row .bkname{border:1px solid transparent;background:transparent;padding:6px;border-radius:8px;font-size:15px;text-align:left;min-width:0}
.bk-row .bkname:focus{border-color:var(--accent);background:var(--card)}

.mem-row{display:block;width:100%;border:0;background:none;text-align:left;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.mem-row:first-of-type{border-top:0}
/* 입력 창의 저장 버튼은 항상 아래에 떠 있게 */
.sheet-panel .actions{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom));z-index:3;background:var(--card);margin:18px -18px calc(-18px - env(safe-area-inset-bottom));padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);box-shadow:0 -8px 16px -10px rgba(0,0,0,.18);align-items:center}
.bk-tot-inline{display:flex;flex-direction:column;flex:none;margin-right:6px;font-variant-numeric:tabular-nums}
.bk-tot-inline small{font-size:11px;color:var(--muted)}
.bk-tot-inline b{font-size:16px}
.bk-row.bk-sub{grid-template-columns:minmax(0,1fr) auto 110px;padding-left:10px}
.bk-row.bk-sub span{color:var(--muted);font-size:13px}
.own.mute{background:var(--soft);color:var(--muted)}
</style>
</head>

<script>
'use strict';
/* =====================================================================
   Purse — 우리집 가계부
   모든 데이터는 이 기기(브라우저) 안에만 저장됩니다. 외부 전송 없음.
   ===================================================================== */

/* ================= 저장소 ================= */
const KEY = 'household-ledger-v1';   // 기존 데이터와 호환을 위해 키 유지
const DEF_FIXED = ['주거·관리비','통신','보험','교육','대출상환'];
const DEF_VAR = ['식비','카페·간식','장보기','교통','의료','육아','쇼핑','문화·여가','경조사','기타'];
const fresh = () => ({
  v: 3, tx: [], deleted: {}, budgets: {}, budgetsAt: 0, lastBackup: 0, metaAt: 0,
  groups: [{id:'g-fixed', name:'고정지출', fixed:true, cats:[...DEF_FIXED]}, {id:'g-var', name:'변동지출', fixed:false, cats:[...DEF_VAR]}],
  cats: {expense: [...DEF_FIXED, ...DEF_VAR], income: ['급여','부수입','용돈','이자·배당','기타']},
  fixedCats: [...DEF_FIXED],
  methods: ['현금','계좌이체'],
  cards: [{name:'카드', payDay:0, target:0}],
  recurring: [],
  assets: {cash:[], savings:[], stocks:[], use:[], debts:[]},
  funds: [], pools: [], poolTx: [], ins: [],
  debtPlan: {monthly:0, ids:[], order:'rate', day:25},
  pay: payDefault(),
  members: [{id:'common', name:'공동'}, {id:'u1', name:'사용자1'}, {id:'u2', name:'사용자2'}, {id:'u3', name:'사용자3'}],
  catOwner: {}
});
const ASSET_KINDS = ['cash','savings','stocks','use','debts'];
function rebuildCats(s){
  s = s || S;
  s.cats.expense = [...new Set(s.groups.flatMap(g => g.cats))];
  s.fixedCats = [...new Set(s.groups.filter(g => g.fixed).flatMap(g => g.cats))];
}
// 이전 버전 데이터를 최신 구조로 변환 (데이터 손실 없음)
const catKeyRaw = (type, c) => (type === 'income' ? 'i:' : '') + c;
// 사용자별 분류를 없애면서: '용돈@u1' → '용돈(아빠)' (겹치지 않으면 '용돈'), 사용자별 수입 예산은 합침
function flattenUsers(s){
  const mname = id => ((s.members || []).find(m => m.id === id) || {}).name || id;
  // 예전 방식(카테고리→사용자 표)은 이름만 그대로 두고 버림
  s.catOwner = {};
  for(const type of ['expense','income']){
    const all = type === 'income' ? s.cats.income : (s.groups || []).flatMap(g => g.cats);
    const map = {};
    for(const c of all){ const m = String(c).match(/^(.*)@(u[123])$/); if(!m) continue;
      const label = m[1], plainTaken = all.includes(label) || Object.values(map).includes(label);
      const sameLabel = all.filter(x => String(x).replace(/@u[123]$/, '') === label).length;
      let nw = !plainTaken && sameLabel === 1 ? label : `${label}(${mname(m[2])})`;
      while(all.includes(nw) || Object.values(map).includes(nw)) nw += "'";
      map[c] = nw; }
    if(!Object.keys(map).length) continue;
    const R = c => map[c] || c;
    if(type === 'income') s.cats.income = s.cats.income.map(R); else for(const g of s.groups || []) g.cats = g.cats.map(R);
    const mv = o => { if(!o) return; for(const [old, nw] of Object.entries(map)){ const ok = catKeyRaw(type, old), nk = catKeyRaw(type, nw); if(o[ok] != null){ o[nk] = o[ok]; delete o[ok]; } } };
    mv(s.budgets); for(const e of s.budgetLog || []) mv(e.b);
    for(const t of s.tx) if(t.type === type && map[t.cat]) t.cat = map[t.cat];
    if(type === 'expense'){ for(const r of s.recurring || []) r.cat = R(r.cat); for(const f of s.funds || []) f.cats = (f.cats||[]).map(R); for(const p of s.pools || []) p.cats = (p.cats||[]).map(R); }
  }
  // 사용자별 수입 예산 'i:급여#u1' → 'i:급여'에 합침
  for(const o of [s.budgets, ...(s.budgetLog || []).map(e => e.b || {})]) for(const k of Object.keys(o || {})){ const m = k.match(/^(i:.*)#u[123]$/); if(m){ o[m[1]] = (o[m[1]] || 0) + (+o[k] || 0); delete o[k]; } }
  for(const t of s.tx) delete t.owner;
}
function migrate(d){
  d = (d && typeof d === 'object') ? d : {};
  const f = fresh(); const s = {...f, ...d};
  s.cats = {...f.cats, ...(d.cats || {})};
  if(!Array.isArray(s.tx)) s.tx = [];
  s.tx = s.tx.filter(t => t && typeof t === 'object');
  if(!s.deleted || typeof s.deleted !== 'object') s.deleted = {};
  if(!s.budgets || typeof s.budgets !== 'object') s.budgets = {};
  s.assets = {...f.assets, ...((d.assets && typeof d.assets === 'object') ? d.assets : {})};
  for(const k of ASSET_KINDS) if(!Array.isArray(s.assets[k])) s.assets[k] = [];
  if(!Array.isArray(d.cards)){
    const ms = Array.isArray(d.methods) ? d.methods : ['카드','현금','계좌이체'];
    s.cards = ms.filter(m => String(m).includes('카드')).map(name => ({name:String(name), payDay:0, target:0}));
    s.methods = ms.filter(m => !String(m).includes('카드'));
  }
  if(!Array.isArray(s.methods)) s.methods = [...f.methods];
  const oldFixed = Array.isArray(d.fixedCats) ? d.fixedCats : DEF_FIXED;
  if(!Array.isArray(d.groups)){
    const ex = Array.isArray(s.cats.expense) ? s.cats.expense : [];
    s.groups = [{id:'g-fixed', name:'고정지출', fixed:true, cats: ex.filter(c => oldFixed.includes(c))},
                {id:'g-var', name:'변동지출', fixed:false, cats: ex.filter(c => !oldFixed.includes(c))}];
  }
  s.groups = s.groups.filter(g => g && Array.isArray(g.cats)).map(g => ({id: g.id || uid(), name: String(g.name||'그룹'), fixed: !!g.fixed, cats: g.cats.map(String)}));
  if(!s.groups.length) s.groups = f.groups;
  if(!Array.isArray(s.recurring)) s.recurring = [];
  for(const k of ['funds','pools','poolTx','ins']) if(!Array.isArray(s[k])) s[k] = [];
  if(!s.pay || typeof s.pay !== 'object') s.pay = payDefault();
  if(!Array.isArray(s.members) || s.members.length !== 4) s.members = f.members;
  if(!s.catOwner || typeof s.catOwner !== 'object') s.catOwner = {};
  flattenUsers(s);
  for(const [key, own] of Object.entries(s.catOwner)){
    if(!['u1','u2','u3'].includes(own)) { delete s.catOwner[key]; continue; }
    const type = key.startsWith('i:') ? 'income' : 'expense', old = type === 'income' ? key.slice(2) : key, nw = `${old.replace(/@u[123]$/, '')}@${own}`;
    const list = type === 'income' ? s.cats.income : (s.groups || []).flatMap(g => g.cats);
    if(old.endsWith('@' + own) || list.includes(nw)){ delete s.catOwner[key]; continue; }
    if(type === 'income') s.cats.income = s.cats.income.map(c => c === old ? nw : c); else for(const g of s.groups || []) g.cats = g.cats.map(c => c === old ? nw : c);
    const mv = o => { if(o && o[catKeyRaw(type, old)] != null){ o[catKeyRaw(type, nw)] = o[catKeyRaw(type, old)]; delete o[catKeyRaw(type, old)]; } };
    mv(s.budgets); for(const e of s.budgetLog || []) mv(e.b);
    for(const t of s.tx) if(t.type === type && t.cat === old) t.cat = nw;
    if(type === 'expense'){ for(const r of s.recurring || []) if(r.cat === old) r.cat = nw; for(const f of s.funds || []) f.cats = (f.cats||[]).map(c => c === old ? nw : c); for(const pl of s.pools || []) pl.cats = (pl.cats||[]).map(c => c === old ? nw : c); }
    delete s.catOwner[key];
  }
  { const pd = payDefault(); for(const k of ['earners','earn','ded','slips']) if(!Array.isArray(s.pay[k])) s.pay[k] = pd[k]; if(!s.pay.yet || typeof s.pay.yet !== 'object') s.pay.yet = {}; if(!Array.isArray(s.pay.extraHol)) s.pay.extraHol = []; }
  if(!s.debtPlan || typeof s.debtPlan !== 'object') s.debtPlan = f.debtPlan;
  if(!Array.isArray(s.debtPlan.ids)) s.debtPlan.ids = [];
  s.cards = s.cards.map(c => ({name:String(c.name), payDay:+c.payDay||0, target:+c.target||0}));
  // v2 → v3: 집·차에 붙어 있던 대출을 '대출' 항목으로 분리 (결정적 id라 두 기기 결과가 같음)
  if(!(d.assets && Array.isArray(d.assets.debts))){
    for(const u of s.assets.use){
      if(!(u.loan > 0 || u.loanMonthly > 0 || (u.repay||[]).length)) continue;
      const did = 'd-' + u.id;
      s.assets.debts.push({id:did, name:`${u.name} 대출`, bank:'', loan:u.loan||0, loanRate:u.loanRate||0, loanMonthly:u.loanMonthly||0,
        repayDay:u.repayDay||0, repay:u.repay||[], goalStart:u.goalStart||'', link:u.id, maturity:'', updated:u.updated||0});
      const oldRid = 'loan-' + u.id, newRid = 'loan-' + did;
      s.recurring = s.recurring.map(r => r.id === oldRid ? {...r, id:newRid, loanId:did} : r);
      for(const t of s.tx) if(t.rid === oldRid) t.rid = newRid;
    }
    s.assets.use = s.assets.use.map(u => { const o = {...u}; delete o.loan; delete o.loanRate; delete o.loanMonthly; delete o.repayDay; delete o.repay; delete o.goalStart; return o; });
  }
  rebuildCats(s);
  for(const t of s.tx) if(t.type === 'expense' && !t.kind) t.kind = s.fixedCats.includes(t.cat) ? 'fixed' : 'variable';
  s.v = 3;
  return s;
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw) return migrate(JSON.parse(raw)); }catch(e){}
  return fresh();
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('저장하지 못했어요. 기기 저장공간을 확인하세요.'); }
}
/* ================= 유틸 ================= */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const won = n => Math.round(n || 0).toLocaleString('ko-KR');
const short = n => { n = Math.round(n||0); const a = Math.abs(n);
  if(a >= 1e8) return (n/1e8).toFixed(a >= 1e9 ? 0 : 1).replace(/\.0$/,'') + '억';
  if(a >= 1e4) return (n/1e4).toFixed(a >= 1e6 ? 0 : 1).replace(/\.0$/,'') + '만';
  return won(n); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function updBkTotal(){

function fillBudgets(n){
  const ks = []; for(let i=1; i<=n; i++) ks.push(addMonths(ym(), -i));
  const by = {}; for(const t of S.tx) if(ks.some(k => t.date.startsWith(k))) by[t.type + '|' + t.cat] = (by[t.type + '|' + t.cat]||0) + t.amount;
  for(const i of document.querySelectorAll('[data-bk]')){
    const key = i.dataset.bk, v = key.startsWith('i:') ? by['income|' + key.slice(2)] : by['expense|' + key];
    i.value = v ? won(Math.round(v / n / 1000) * 1000) : '';
  }
  for(const i of document.querySelectorAll('[data-bsav]')){ const v = S.tx.filter(t=>t.type==='saving'&&t.target===i.dataset.bsav&&ks.some(k=>t.date.startsWith(k))).reduce((s,t)=>s+t.amount,0); if(v) i.value = won(Math.round(v/n/1000)*1000); }
  updBkTotal(); toast(n === 1 ? '지난달 실사용으로 채웠어요. 확인 후 저장하세요' : '최근 3개월 평균으로 채웠어요. 확인 후 저장하세요');

function applyBkRow(row){

  if(r < 0){ nameI.value = catLabel(old); return; }
  const nk = catKey(type, nw); nameI.dataset.bkname = nk; budI.dataset.bk = nk;

function submitBudget(){
  // 1) 이름 바꾸기 → 2) 사용자 → 3) 예산 (바뀐 이름 기준)
  const map = {}; let renamed = 0, dup = 0;
  for(const i of document.querySelectorAll('[data-bkname]')){
    const key = i.dataset.bkname, type = i.dataset.ctype, old = type === 'income' ? key.slice(2) : key;
    const nw = catName(i.value.trim() || catLabel(old), 'common');
    const r = renameCatCore(type, old, nw); if(r === -2) dup++; if(r >= 0) renamed++;
    map[key] = r >= 0 ? catKey(type, nw) : key;
  }
  for(const i of document.querySelectorAll('[data-bk]')){ const k = map[i.dataset.bk] || i.dataset.bk, raw = i.value.trim(); if(raw === '') delete S.budgets[k]; else S.budgets[k] = digits(raw); }
  touchMeta(); if(dup) toast('이미 있는 이름으로는 바꾸지 않았어요');
  const now = Date.now();
  for(const i of document.querySelectorAll('[data-bsav]')){ const a = S.assets.savings.find(x => x.id === i.dataset.bsav); if(a){ const v = digits(i.value); if(v !== (a.monthly||0)) S.assets.savings = S.assets.savings.map(x => x === a ? {...a, monthly: v, updated: now} : x); } }
  S.budgetsAt = now; logBudgets(); save(); closeSheet(); render(); if(!dup) toast(renamed ? `예산을 저장했어요 · 이름 ${renamed}개 변경` : '예산을 저장했어요');
}

function fundBalanceAt(f, k){ // k월 말 잔액
  const st = f.start || curYm(); if(k < st) return f.base||0;

const estInterest = x => Math.round((x.loan||0) * (x.loanRate||0) / 1200);
function loanPlan(x){
  const G = x.loanMonthly||0, B = x.loan||0; if(!G) return null;
  const k = curYm(), mr = (x.loanRate||0)/1200, rp = x.repay||[];
  const paidThis = rp.filter(r=>r.date.startsWith(k)).reduce((s,r)=>s+r.principal,0);
  let b = B, interest = 0, off = 0;
  const step = amt => { interest += b*mr; b = Math.max(0, b-amt); };
  if(b > 0){ if(paidThis < G) step(G - paidThis); while(b > 0 && off < 1200){ off++; step(G); } }
  const start = x.goalStart || k;
  const elapsed = Math.max(1, monthsBetween(start, k) + 1);
  const actual = rp.filter(r=>r.date.slice(0,7) >= start).reduce((s,r)=>s+r.principal,0);
  return {G, paidThis, payoff: addMonths(k, off), months: off + (paidThis < G ? 1 : 0), interest: Math.round(interest), elapsed, expected: G*elapsed, actual, done: B <= 0};
}

// 통합 상환 계획: 매달 총액(원리금)으로 이자를 먼저 내고, 남는 돈을 우선순위 대출 원금에 몰아서 상환
function simulatePlan(){
  const P = S.debtPlan;
  let ds = S.assets.debts.filter(d => P.ids.includes(d.id) && (d.loan||0) > 0).map(d => ({id:d.id, name:d.name, b:d.loan, r:(d.loanRate||0)/1200, interest:0, end:null}));
  const order = P.order === 'small' ? [...ds].sort((a,b)=>a.b-b.b) : P.order === 'list' ? ds : [...ds].sort((a,b)=>b.r-a.r || a.b-b.b);
  const rows = []; let k = curYm(), short = false;
  for(let i=0; i<600 && ds.some(d=>d.b>0); i++){
    let budget = P.monthly; const row = {ym:k, p:0, it:0, items:{}, ends:[]};
    for(const d of ds) if(d.b > 0){ const it = Math.round(d.b*d.r); d.interest += it; budget -= it; row.it += it; row.items[d.id] = {p:0, it}; }
    if(budget <= 0){ short = true; break; }
    for(const d of order) if(d.b > 0 && budget > 0){ const p = Math.min(d.b, budget); d.b -= p; budget -= p; row.p += p; row.items[d.id].p = p; if(d.b <= 0){ d.end = k; row.ends.push(d.name); } }
    row.left = ds.reduce((s,d)=>s+d.b,0); row.spare = budget; rows.push(row); k = addMonths(k, 1);
  }
  return {ds, rows, short, order};
}
function syncPlanTemplate(){

  const active = P.monthly > 0 && P.ids.some(i => S.assets.debts.some(d => d.id===i && d.loan > 0));

    S.recurring = exist ? S.recurring.map(r=>r.id===id?o:r) : [...S.recurring, o]; touchMeta();
  }
  for(const d of S.assets.debts) syncLoanTemplate(d);
}

function syncInsTemplate(p){
  const id = 'ins-' + p.id, exist = S.recurring.find(r => r.id === id);
  if(!p || p.gone || !p.fixed || p.status !== 'active' || !p.premium){ if(exist){ S.recurring = S.recurring.filter(r => r.id !== id); touchMeta(); } return; }
  if(!S.cats.expense.includes('보험')) addExpenseCat('보험', '고정지출', true);
  const o = {id, name: `${p.name} 보험료`, amount: p.premium, day: p.payDay || 25, cat: '보험', method: exist ? exist.method : (S.methods.includes('계좌이체') ? '계좌이체' : (S.methods[0] || '')), vary: false, start: (exist && exist.start) || curYm(), end: p.payEnd ? p.payEnd.slice(0,7) : ''};
  S.recurring = exist ? S.recurring.map(r => r.id === id ? o : r) : [...S.recurring, o]; touchMeta();
}

function nextPay(day){
  if(!day) return null;
  const t0 = today0(); let y = t0.getFullYear(), m = t0.getMonth();
  let d = new Date(y, m, Math.min(day, dim(y, m+1)));
  if(d < t0){ m++; if(m > 11){ m = 0; y++; } d = new Date(y, m, Math.min(day, dim(y, m+1))); }
  return {date: d, dd: Math.round((d - t0)/864e5)};
}

function renameCat(type, old, label){
  const nw = catName(label, catOwnerOf(type, old));
  const n = renameCatCore(type, old, nw);
  if(n === -2) toast('이미 있는 이름이에요');
  if(n >= 0){ save(); toast(`'${catLabel(old)}' → '${catLabel(nw)}'${n?` (내역 ${n}건 함께 변경)`:''}`); }
  render();
}
function setCatOwner(type, old, owner){
  const nw = catName(catLabel(old), owner);
  const n = renameCatCore(type, old, nw);
  if(n === -2){ toast(`${memName(owner)}에게 같은 이름이 이미 있어요`); render(); return; }
  if(n >= 0){ save(); toast(`'${catLabel(old)}' → ${memName(owner)}`); }
  render();
}
// 반환: 바뀐 내역 수, -1 변경 없음, -2 중복
function renameCatCore(type, old, nw){
  nw = String(nw).trim().slice(0,30);
  const list = type === 'income' ? S.cats.income : S.cats.expense;
  if(!nw || nw === old) return -1;
  if(list.includes(nw)) return -2;
  const now = Date.now(); let n = 0;
  const ok = catKey(type, old), nk = catKey(type, nw);
  if(S.catOwner[ok] != null){ S.catOwner[nk] = S.catOwner[ok]; delete S.catOwner[ok]; }
  for(const e of S.budgetLog || []) if(e.b && e.b[ok] != null){ e.b[nk] = e.b[ok]; delete e.b[ok]; }

// 고정 항목·카드 결제일·급여일·적립통장 계획을 날짜별로 모음
function scheduleFor(k){
  const [y, m] = k.split('-').map(Number), last = dim(y, m), ev = [];
  const day = d => `${k}-${pad(Math.min(d || 1, last))}`;
  for(const r of S.recurring.filter(r => (!r.start || r.start <= k) && (!r.end || r.end >= k))){
    const txs = S.tx.filter(t => t.rid === r.id && t.date.startsWith(k));
    ev.push({date: day(r.day), name: r.name, sub: catFull(r.cat), amt: txs.length ? txs.reduce((s,t)=>s+t.amount,0) : r.amount, done: txs.length > 0, kind: 'fixed', rid: r.id});
  }
  for(const c of S.cards) if(c.payDay){
    const unpaid = S.tx.filter(t => t.type === 'expense' && t.method === c.name && !t.paid).reduce((s,t)=>s+t.amount,0);
    ev.push({date: day(c.payDay), name: `${c.name} 결제`, sub: '카드 대금 (선납 안 한 금액)', amt: unpaid, done: unpaid === 0, kind: 'card'});
  }

    const sl = slipOf(e.id, k);

    ev.push({date: pd, name: `${e.name} 급여일`, sub: pd !== payBase(e, k) && !(sl && sl.date) ? `급여 · ${+payBase(e, k).slice(8)}일이 휴일이라 앞당김` : '급여', amt: sl ? slipNet(sl) : 0, done: !!sl, kind: 'pay', inc: true});
  }

    ev.push({date: `${k}-01`, name: p.memo || `${f.name} 지출`, sub: `${f.name} (이달 중 · 적립통장)`, amt: p.amount, done: false, kind: 'fund', month: true});
  return ev.sort((a,b) => a.date.localeCompare(b.date) || (a.month ? -1 : 0));
}
function scheduleRow(e){
  const dd = dday(e.date), cur = e.date.startsWith(curYm());
  const st = e.done ? '<span class="ok">완료</span>' : e.month ? '이달 중' : cur ? (dd < 0 ? `<span class="exp">${-dd}일 지남</span>` : ddTxt(dd)) : (e.date < dstr(today0()) ? '<span class="exp">미완료</span>' : '예정');
  return `<div class="sch-row ${e.done ? 'done' : ''}"><span class="sch-d"><b>${e.month ? '–' : +e.date.slice(8)}</b><small>${e.month ? '' : DOW[new Date(e.date + 'T00:00:00').getDay()]}</small></span>
    <span class="mid"><b>${esc(e.name)}</b><small>${esc(e.sub)} · ${st}</small></span><span class="amt ${e.inc ? 'inc' : ''}">${e.inc ? '+' : ''}${won(e.amt)}</span></div>`;
}
function scheduleHtml(k, onlyUpcoming){
  let ev = scheduleFor(k);
  if(onlyUpcoming){ const t = dstr(today0()), lim = dstr(new Date(today0().getTime() + 14*864e5));
    ev = scheduleFor(curYm()).concat(scheduleFor(addMonths(curYm(), 1))).filter(e => !e.done && !e.month && e.date <= lim && (e.date >= t || e.date.startsWith(curYm()))); }
  const out = ev.filter(e => !e.inc && !e.done).reduce((s,e)=>s+e.amt,0);
  return {ev, out, html: ev.map(scheduleRow).join('')};
}

/* 연말정산 계산 (2026년 귀속 기준 · 추정치) */
function earnedDeduction(g){ if(g <= 5e6) return g*0.7; if(g <= 1.5e7) return 3.5e6 + (g-5e6)*0.4; if(g <= 4.5e7) return 7.5e6 + (g-1.5e7)*0.15; if(g <= 1e8) return 1.2e7 + (g-4.5e7)*0.05; return Math.min(2e7, 1.475e7 + (g-1e8)*0.02); }
function incomeTax(t){ for(const [lim, r, d] of [[1.4e7,.06,0],[5e7,.15,1.26e6],[8.8e7,.24,5.76e6],[1.5e8,.35,1.544e7],[3e8,.38,1.994e7],[5e8,.40,2.594e7],[1e9,.42,3.594e7],[Infinity,.45,6.594e7]]) if(t <= lim) return Math.max(0, t*r - d); }
function earnedCredit(tax, g){
  const c = tax <= 1.3e6 ? tax*0.55 : 715000 + (tax-1.3e6)*0.3;
  const lim = g <= 3.3e7 ? 740000 : g <= 7e7 ? Math.max(660000, 740000 - (g-3.3e7)*0.008) : g <= 1.2e8 ? Math.max(500000, 660000 - (g-7e7)*0.5) : Math.max(200000, 500000 - (g-1.2e8)*0.5);
  return Math.min(c, lim);
}
function cardDeduction(g, x){
  const low = g <= 7e7, kids = +x.kidsAll || 0;
  const parts = [[(+x.credit||0) + (low ? 0 : (+x.culture||0)), .15, 'c'], [low ? (+x.culture||0) : 0, .30, 'cu'], [+x.debit||0, .30, 'd'], [+x.market||0, .40, 'm'], [+x.transit||0, .40, 't']];
  let rem = g * 0.25, total = 0, extraBase = 0;
  for(const [amt, rate, k] of parts){ const used = Math.min(amt, rem); rem -= used; const d = (amt - used) * rate; total += d; if(k === 'cu' || k === 'm' || k === 't') extraBase += d; }
  const basic = (low ? 3e6 : 2.5e6) + (kids >= 2 ? (low ? 1e6 : 5e5) : kids === 1 ? (low ? 5e5 : 2.5e5) : 0);
  const extra = Math.min(Math.max(0, total - basic), extraBase, low ? 3e6 : 2e6);
  return {total, ded: Math.min(total, basic) + extra, used: g*0.25 - rem, th: g*0.25};
}
function yetInputs(eid, y){ const key = eid + '-' + y; return S.pay.yet[key] || {}; }
function yetCalc(e, y, projectYear){
  const sl = yearSlips(e.id, y), x = yetInputs(e.id, y);
  const n = sl.length, lastM = n ? +sl[n-1].ym.slice(5) : 0, rest = projectYear && n ? 12 - lastM : 0;
  const tot = f => { const a = sl.reduce((s,v)=>s+f(v),0); return a + (n ? a/n*rest : 0); };
  const g = Math.round(tot(slipTaxable)), withheld = Math.round(tot(s => slipRole(s,'tax'))), np = tot(s => slipRole(s,'np')), ins = tot(s => slipRole(s,'hi') + slipRole(s,'ltc') + slipRole(s,'ei'));
  const cardAuto = S.tx.filter(t => t.type === 'expense' && isCard(t.method) && t.date.startsWith(String(y))).reduce((s,t)=>s+t.amount,0);
  const insAuto = insYearPremium(e, y);
  const inp = {...x, credit: x.credit != null && x.credit !== '' ? x.credit : cardAuto, insurance: x.insurance != null && x.insurance !== '' ? x.insurance : insAuto};
  const ed = earnedDeduction(g), person = 1.5e6 * Math.max(1, +inp.persons || 1);
  const card = cardDeduction(g, inp);
  const subs = g <= 7e7 ? 0.4 * Math.min(3e6, +inp.subscription||0) : 0;
  const base = (withIns) => Math.max(0, g - ed - person - np - (withIns ? ins : 0) - (+inp.housing||0) - subs - card.ded);
  const kids = +inp.kids8 || 0, kidC = kids <= 0 ? 0 : kids === 1 ? 250000 : kids === 2 ? 550000 : 550000 + 400000*(kids-2);
  const pens = Math.min(9e6, Math.min(6e6, +inp.pension||0) + (+inp.irp||0)) * (g <= 5.5e7 ? 0.15 : 0.12);
  const special = 0.12*Math.min(1e6, +inp.insurance||0) + 0.15*Math.max(0, (+inp.medical||0) - g*0.03) + 0.15*(+inp.education||0)
    + 0.15*Math.min(1e7, +inp.donation||0) + 0.30*Math.max(0, (+inp.donation||0) - 1e7);
  const rent = g <= 8e7 ? (g <= 5.5e7 ? 0.17 : 0.15) * Math.min(1e7, +inp.rent||0) : 0;
  const other = (inp.marriage ? 500000 : 0) + (+inp.birthCredit||0);
  const run = itemized => { const tb = base(itemized), tax = incomeTax(tb), ec = earnedCredit(tax, g);
    const credits = ec + kidC + pens + other + (itemized ? special + rent : 130000);
    return {tb, tax, ec, credits, final: Math.max(0, Math.round(tax - credits))}; };
  const A = run(true), B = run(false), best = B.final < A.final ? {...B, std:true} : {...A, std:false};

    refund: withheld - best.final, localRefund: Math.round(withheld*0.1) - Math.round(best.final*0.1)};
}
/* 퇴직금 (오늘 기준 · 법정 퇴직금 계산식) */
function severanceCalc(e){
  if(!e.hire) return null;
  const t = today0(), h = new Date(e.hire + 'T00:00:00'); const days = Math.floor((t - h) / 864e5);
  const slips = S.pay.slips.filter(s => s.earner === e.id && s.ym <= curYm()).sort((a,b)=>b.ym.localeCompare(a.ym));
  const last3 = slips.slice(0, 3);
  const regular = s => slipGross(s) - sumBy(s, it => it.bonus || it.leave, 'earn');
  const k12 = addMonths(curYm(), -11);
  const in12 = slips.filter(s => s.ym >= k12);
  const wage3 = e.sevWage3 ? +e.sevWage3 : last3.reduce((a,s)=>a+regular(s),0);
  const bonus12 = e.sevBonus != null && e.sevBonus !== '' ? +e.sevBonus : in12.reduce((a,s)=>a+sumBy(s, it => it.bonus, 'earn'),0);
  const leave12 = e.sevLeave != null && e.sevLeave !== '' ? +e.sevLeave : in12.reduce((a,s)=>a+sumBy(s, it => it.leave, 'earn'),0);
  const d3 = last3.length === 3 && !e.sevWage3 ? last3.reduce((a,s)=>a+dim(+s.ym.slice(0,4), +s.ym.slice(5)),0) : 92;
  const avg = (wage3 + bonus12*3/12 + leave12*3/12) / d3;
  return {days, years: Math.floor(days/365), months: Math.floor((days % 365) / 30.4), wage3, bonus12, leave12, d3, avg, sev: Math.round(avg * 30 * days / 365), eligible: days >= 365, n3: last3.length};
}

  if(txId){

/* ================= 백업 · 동기화 (AES-GCM 암호화) ================= */
function b64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const b=atob(s); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
function download(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
let keyCache = {pw:null, salt:null, key:null};
async function encryptPayload(pw, payload){
  if(keyCache.pw !== pw){ const salt = crypto.getRandomValues(new Uint8Array(16)); keyCache = {pw, salt, key: await deriveKey(pw, salt)}; }
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, keyCache.key, new TextEncoder().encode(JSON.stringify(payload)));
  return {format:'household-ledger-backup', v:1, enc:true, salt:b64(keyCache.salt), iv:b64(iv), data:b64(new Uint8Array(ct))};
}
let prepared = null;
const canShareFile = f => !!(navigator.canShare && navigator.share && navigator.canShare({files:[f]}));

  const poolSh = sheets.find(s => /가족계|모임|회비/.test(s.name));
  const pool = poolSh ? parsePoolSheet(poolSh) : null;
  if(!months.length){ toast('월별 가계부 시트(예: 26-11)를 찾지 못했어요'); return; }

  // 모든 달의 항목을 합쳐 이름을 정함 (달마다 같은 이름이 되도록)
  const all = []; for(const mo of months) for(const it of mo.items) all.push(it);
  const key = it => [it.sec, it.table, it.A, it.B, it.C].join('|');
  const uniq = new Map(); for(const it of all) if(!uniq.has(key(it))) uniq.set(key(it), {...it});
  const named = nameItems([...uniq.values()]); const nameOf = new Map(named.map(x => [key(x), x]));
  const spanName = x => x.pp ? `${x.table} 전체(${x.A})` : `${x.A || x.base} 전체`;
  const spanCats = {}; // group → [이름]
  for(const it of all){ if(!(it.dSpan || it.eSpan)) continue; const x = nameOf.get(key(it)); if(x.ns !== 'expense') continue;
    const n = spanName(x); (spanCats[x.group] = spanCats[x.group] || []); if(!spanCats[x.group].includes(n)) spanCats[x.group].push(n); }

  for(const x of named){
    if(x.ns === 'income'){ if(!income.includes(x.name)) income.push(x.name); continue; }
    if(x.ns === 'saving'){ if(!savingNames.includes(x.name)) savingNames.push(x.name); continue; }
    if(gIdx[x.group] == null){ gIdx[x.group] = groups.length; groups.push({id: uid(), name: x.group.slice(0,20), key: x.group, fixed: x.sec === 1 || x.sec === 4, cats: [], sec: x.sec}); }

  // 저축 (5번 구역: D 월저금액, F 잔액, G 금리, H 은행, I 만기)
  const savInfo = {}; for(const it of latest.items.filter(it => it.sec === 5)){ const n = nameOf.get(key(it)).name; savInfo[n] = {monthly: it.budget||0, balance: +it.F||0, rate: xlRate(it.G), bank: typeof it.H === 'string' ? it.H : '', maturity: xlDate(it.I)}; }

  openXlPreview();
}

function hashStr(s){ let h = 0; for(const ch of s) h = (h*31 + ch.charCodeAt(0)) >>> 0; return h.toString(36); }
function applyXl(){
  const p = xlParsed; if(!p){ closeSheet(); return; }

    p.savingNames = p.savingNames.filter(n => !hid(n));
    for(const mo of p.monthly) for(const k of Object.keys(mo.agg)) if(k.startsWith('saving|') && hid(k.slice(7))) delete mo.agg[k];
    for(const k of Object.keys(p.budgets)) if(k.startsWith('s:') && hid(k.slice(2))) delete p.budgets[k];
  }
  if($('#xlCats').checked){
    const used = new Set(S.tx.filter(t=>t.type==='expense').map(t=>t.cat));
    const newCats = new Set(p.groups.flatMap(g=>g.cats));
    const keep = [...used].filter(c => !newCats.has(c) && !p.debts.some(d=>d.name===c));
    S.groups = p.groups.map(({sec, ...g}) => g);
    if(keep.length) S.groups.push({id: uid(), name: '기존 카테고리', fixed: false, cats: keep});
    const usedInc = new Set(S.tx.filter(t=>t.type==='income').map(t=>t.cat));
    S.cats.income = [...new Set([...p.income, ...[...usedInc].filter(c => !p.income.includes(c))])];
    rebuildCats(); done.push('카테고리');
  }
  if($('#xlAssets').checked){
    const upsert = (kind, name, fields) => { const x = S.assets[kind].find(a => a.name === name);
      if(x) S.assets[kind] = S.assets[kind].map(a => a === x ? {...a, ...fields, updated: now} : a);
      else S.assets[kind].push({id: uid(), name, ...fields, updated: now}); };
    for(const it of p.port){
      if(/현금/.test(it.cls)) upsert('cash', it.name, {bank:'', balance: it.amt||0});
      else if(/사용|부동산/.test(it.cls)) upsert('use', it.name, {type: /아파트|집|주택|빌라/.test(it.name) ? '집' : /차|자동차/.test(it.name) ? '차' : '기타', value: it.amt||0, valueDate: dstr(new Date()), buyPrice: 0});
      else if(/주식/.test(it.name)) upsert('stocks', it.name, {account:'', qty:1, avg: it.amt||0, price: it.amt||0});
      else { const si = p.savInfo[it.name] || {}; upsert('savings', it.name, {bank: si.bank||'', type: si.monthly ? '적금' : '예금', balance: it.amt||0, monthly: si.monthly||0, rate: si.rate||0, maturity: si.maturity||''}); }
    }
    // 포트폴리오에 없는 저축 항목도 예적금으로 (잔액이나 월저금액이 있을 때)
    for(const [n, si] of Object.entries(p.savInfo)){
      if(S.assets.savings.some(a => a.name === n) || S.assets.stocks.some(a => a.name === n)) continue;
      if(p.port.some(x => x.name === n)) continue;
      if(si.balance || si.monthly) upsert('savings', n, {bank: si.bank||'', type: si.monthly ? '적금' : '예금', balance: si.balance||0, monthly: si.monthly||0, rate: si.rate||0, maturity: si.maturity||''});
    }
    for(const d of p.debts){
      const link = (S.assets.use.find(u => d.value && u.value === d.value) || S.assets.use.find(u => /주택|아파트|집/.test(d.name) && u.type==='집') || {}).id || '';
      const x = S.assets.debts.find(a => a.name === d.name);
      const f = {bank: d.bank, loan: d.loan, loanRate: d.rate, maturity: d.maturity, link: x && x.link || link};
      if(x) S.assets.debts = S.assets.debts.map(a => a === x ? {...a, ...f, updated: now} : a);
      else S.assets.debts.push({id: uid(), name: d.name, ...f, loanMonthly: 0, repayDay: 0, repay: [], goalStart: '', updated: now});
      addExpenseCat(d.name, '부채 상환', true);
    }
    done.push('자산·대출');
  }
  if($('#xlMonthly').checked){
    let n = 0;

      const [y, m] = mo.k.split('-').map(Number); const date = `${mo.k}-${pad(dim(y, m))}`;
      for(const [kk, amt] of Object.entries(mo.agg)){
        const [ns, name] = [kk.slice(0, kk.indexOf('|')), kk.slice(kk.indexOf('|')+1)];
        const id = `xl-${mo.k}-${ns}-${hashStr(name)}`;
        const t = {id, type: ns, amount: Math.abs(Math.round(amt)), date, cat: name, method: '', memo: `${m}월 합계 (엑셀)`, created: now, updated: now, imported: true};

        delete S.deleted[id];

        n++;

    }
    done.push(`월별 금액 ${n}건`);
  }
  if($('#xlBudgets').checked){
    for(const [k, v] of Object.entries(p.budgets)){
      if(k.startsWith('s:')){ const a = S.assets.savings.find(x => x.name === k.slice(2)); if(a && v) S.assets.savings = S.assets.savings.map(x => x === a ? {...a, monthly: v, updated: now} : x); }

    const sec3 = new Set(p.groups.filter(g => g.sec === 3).flatMap(g => g.cats));
    for(const f of p.funds){
      const cats = S.cats.expense.filter(c => (sec3.size ? sec3.has(c) : true) && f.words.some(w => c === w || c.startsWith(w + '(') || c.includes(w)));

    }
    done.push('적립 통장');
  }
  if($('#xlPool') && $('#xlPool').checked && p.pool){
    let pl = S.pools.find(x => x.name === p.pool.name);
    const lastMon = p.pool.ents.reduce((m,e)=>e.date.slice(0,7) > m ? e.date.slice(0,7) : m, `${p.pool.year}-01`);
    const cats = S.cats.expense.filter(c => c.includes('가족계'));

    p.pool.ents.forEach((e, i) => { const id = `xlp-${pl.id}-${e.date}-${i}`; delete S.deleted[id];
      const o = {id, pool: pl.id, type: e.type, amount: Math.round(e.amount), date: e.date, memo: e.memo, updated: now};

}

   가계부 합계·통계·자산·내보내기에 포함되지 않고, 비밀번호로 암호화되어 저장됨 */
let secretKey = null, secretData = null, secSel = null;
const SEC_DEFAULT = () => ({pockets:[{id:'pk-allowance', name:'용돈', goal:0}, {id:'pk-emergency', name:'비상금', goal:0}], entries:[]});
async function unlockSecret(pin){
  if(!S.secret){
    const salt = crypto.getRandomValues(new Uint8Array(16));
    secretKey = {key: await deriveKey(pin, salt), salt}; secretData = SEC_DEFAULT(); await saveSecret(); return true;
  }
  try{
    const salt = unb64(S.secret.salt), key = await deriveKey(pin, salt);

  }catch(e){ return false; }
}

  const iv = crypto.getRandomValues(new Uint8Array(12));

  S.secret = {salt:b64(secretKey.salt), iv:b64(iv), data:b64(new Uint8Array(ct)), at:Date.now()}; save();
}

  if((b = el('[data-csel]'))){ cardSel = b.dataset.csel; selIds.clear(); render(); return; }
  if(el('#selAll')){
    const ids = [...document.querySelectorAll('[data-sel]')].map(x=>x.dataset.sel);
    const all = ids.length && ids.every(id=>selIds.has(id));
    selIds.clear(); if(!all) ids.forEach(id=>selIds.add(id)); render(); return;
  }
  if(el('#payDone')){
    const now = Date.now(); const n = selIds.size;
    for(const t of S.tx) if(selIds.has(t.id)){ t.paid = true; t.paidAt = now; t.updated = now; }
    selIds.clear(); save(); render(); toast(`${n}건 선납 완료 처리했어요`); return;
  }
  if((b = el('[data-unpay]'))){
    const t = S.tx.find(x=>x.id===b.dataset.unpay); if(!t) return;
    t.paid = false; delete t.paidAt; t.updated = Date.now(); save(); render(); toast('선납 완료를 취소했어요'); return;
  }
  // 설정 · 카테고리
  if((b = el('[data-cattab]'))){ catTab = b.dataset.cattab; renderSettings(); return; }
  if((b = el('[data-grpfix]'))){ const g = S.groups[+b.dataset.grpfix]; g.fixed = !g.fixed; rebuildCats(); touchMeta(); save(); renderSettings(); return; }
  if((b = el('[data-grpmove]'))){ const i = +b.dataset.grpmove, j = i + (+b.dataset.dir); if(j<0||j>=S.groups.length) return; [S.groups[i], S.groups[j]] = [S.groups[j], S.groups[i]]; rebuildCats(); touchMeta(); save(); renderSettings(); return; }
  if((b = el('[data-grpdel]'))){
    const g = S.groups[+b.dataset.grpdel];
    if(g.cats.length){ toast('카테고리를 다른 그룹으로 옮기거나 지운 뒤에 그룹을 지울 수 있어요'); return; }
    if(S.groups.length <= 1) return;
    S.groups.splice(+b.dataset.grpdel, 1); rebuildCats(); touchMeta(); save(); renderSettings(); return;
  }
  if((b = el('[data-move]'))){
    const g = S.groups[+b.dataset.move], i = +b.dataset.idx, j = i + (+b.dataset.dir);
    if(!g || j < 0 || j >= g.cats.length) return;
    [g.cats[i], g.cats[j]] = [g.cats[j], g.cats[i]]; rebuildCats(); touchMeta(); save(); renderSettings(); return;
  }
  if((b = el('[data-imove]'))){
    const l = S.cats.income, i = +b.dataset.imove, j = i + (+b.dataset.dir); if(j<0||j>=l.length) return;
    [l[i], l[j]] = [l[j], l[i]]; touchMeta(); save(); renderSettings(); return;
  }
  if((b = el('[data-delcat]'))){
    const key = b.dataset.delcat, name = b.dataset.name;
    if(key === 'income' && S.cats.income.length <= 1){ toast('최소 하나는 남겨야 해요'); return; }
    if(key === 'expense' && S.cats.expense.length <= 1){ toast('최소 하나는 남겨야 해요'); return; }
    if(!confirm(`'${name}'을(를) 목록에서 뺄까요? (기존 내역은 그대로 남아요)`)) return;
    if(key === 'methods') S.methods = S.methods.filter(m=>m!==name);
    else if(key === 'income') S.cats.income = S.cats.income.filter(c=>c!==name);
    else removeExpenseCat(name);
    touchMeta(); save(); renderSettings(); return;
  }
  if((b = el('[data-delcard]'))){
    const i = +b.dataset.delcard; const c = S.cards[i];
    if(!confirm(`'${c.name}'을(를) 카드 목록에서 뺄까요? (기존 내역은 그대로 남지만 선납 목록에서는 빠져요)`)) return;
    S.cards.splice(i, 1); if(cardSel === c.name) cardSel = 'all'; touchMeta(); save(); renderSettings(); return;
  }
  if(el('#syncSend')){ sendSync(); return; }
  if(el('#syncPwReset')){ if(confirm('동기화 비밀번호를 다시 설정할까요? 다른 기기도 같은 비밀번호로 바꿔야 해요.')){ setSyncPw(''); keyCache = {pw:null}; renderSettings(); } return; }
  if(el('#exportBtn')){ exportBackup().catch(()=>toast('백업 중 오류가 났어요')); return; }
  if(el('#csvMonth')){ exportCSV(false); return; }
  if(el('#csvAll')){ exportCSV(true); return; }
  if(el('#wipe')){
    if(!confirm('이 기기의 모든 데이터를 삭제할까요?')) return;
    if(!confirm('정말 삭제할까요? 되돌릴 수 없어요.')) return;
    try{ localStorage.removeItem(KEY); }catch(_){}
    S = fresh(); view = 'stats'; render(); toast('모두 삭제했어요');
  }
});
document.addEventListener('submit', e => {
  if(e.target.id === 'syncPwForm'){
    e.preventDefault(); const v = $('#syncPw').value;
    if(v.length < 6){ toast('6자 이상으로 정해 주세요'); return; }
    setSyncPw(v); renderSettings(); toast('설정했어요. 다른 기기에도 같은 비밀번호를 설정하세요'); return;
  }
  if(e.target.matches('form[data-addgroup]')){
    e.preventDefault(); const name = e.target.querySelector('input').value.trim().slice(0,20); if(!name) return;
    if(S.groups.some(g=>g.name===name)){ toast('이미 있는 그룹이에요'); return; }
    S.groups.push({id: uid(), name, fixed: false, cats: []}); touchMeta(); save(); renderSettings(); return;
  }
  const f = e.target.closest('form[data-addcat]'); if(!f) return;
  e.preventDefault();
  const name = f.querySelector('input').value.trim().slice(0,24);
  if(!name) return;
  const key = f.dataset.addcat;
  if(key === 'cards' || key === 'methods'){
    if(allMethods().includes(name)){ toast('이미 있는 이름이에요'); return; }
    if(key === 'cards') S.cards.push({name, payDay:0, target:0}); else S.methods.push(name);
  } else {
    const nm = catName(name, 'common');
    if(key === 'income'){
      if(S.cats.income.includes(nm)){ toast('이미 있는 이름이에요'); return; }
      S.cats.income.push(nm);
    } else if(key.startsWith('g:')){
      if(S.cats.expense.includes(nm)){ toast('이미 있는 이름이에요 (다른 그룹 포함)'); return; }
      S.groups[+key.slice(2)].cats.push(nm); rebuildCats();
    }
  }
  touchMeta(); save(); render();
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'q'){ q = t.value; renderListBody(); return; }
  if(t.id === 'fAmt' || t.dataset.budget !== undefined || t.dataset.money !== undefined){
    const d = String(t.value).replace(/\D/g,'').slice(0,13);
    t.value = d ? Number(d).toLocaleString('ko-KR') : '';
    if(t.dataset.bk !== undefined) updBkTotal();
    if(t.dataset.slip !== undefined) updSlipNet();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.budget !== undefined){
    const raw = String(t.value).trim();
    if(raw === '') delete S.budgets[t.dataset.budget]; else S.budgets[t.dataset.budget] = digits(raw);
    S.budgetsAt = Date.now(); logBudgets(); save(); render(); return;
  }
  if(t.dataset.bkname !== undefined){ applyBkRow(t.closest('.bk-row')); return; }
  if(t.dataset.rename !== undefined){ renameCat(t.dataset.rename, t.dataset.old, t.value); return; }
  if(t.dataset.catown !== undefined){ setCatOwner(t.dataset.ctype, t.dataset.catown, t.value); return; }
  if(t.dataset.memname !== undefined){ const m = S.members.find(x => x.id === t.dataset.memname); const v = t.value.trim().slice(0,10); if(m && v){ m.name = v; touchMeta(); save(); } return; }
  if(t.dataset.grpname !== undefined){ const nm = t.value.trim().slice(0,20); const g = S.groups[+t.dataset.grpname]; if(nm && !S.groups.some(x=>x!==g && x.name===nm)){ g.name = nm; touchMeta(); save(); } renderSettings(); return; }
  if(t.dataset.catgrp !== undefined){ const c = t.dataset.catgrp, to = S.groups[+t.value]; for(const g of S.groups) g.cats = g.cats.filter(x=>x!==c); to.cats.push(c); rebuildCats(); touchMeta(); save(); renderSettings(); return; }
  if(t.dataset.cardname !== undefined){ renameCard(+t.dataset.cardname, t.value); return; }
  if(t.dataset.payday !== undefined){ S.cards[+t.dataset.payday].payDay = +t.value; touchMeta(); save(); return; }
  if(t.dataset.cardtarget !== undefined){ S.cards[+t.dataset.cardtarget].target = digits(t.value); touchMeta(); save(); return; }
  if(t.dataset.sel !== undefined){ t.checked ? selIds.add(t.dataset.sel) : selIds.delete(t.dataset.sel); renderSelbar(); return; }
  if(t.name === 'fOwner'){ ownerManual = true; return; }
  if(t.name === 'fCat'){ if(!ownerManual) fillOwner(); if(!kindManual && formType === 'expense'){ formKind = S.fixedCats.includes(t.value) ? 'fixed' : 'variable'; setKindSeg(); } return; }
  if(t.name === 'fMethod'){ updatePaidVis(); return; }
  if((t.id==='importFile' || t.id==='syncFile') && t.files[0]){ importBackup(t.files[0]); t.value=''; return; }
  if(t.id==='xlFile' && t.files[0]){ const f = t.files[0]; t.value=''; handleXl(f); }
});
document.addEventListener('keydown', e => {
  if(e.key==='Enter' && e.target.matches && e.target.matches('[data-rename],[data-cardname],[data-grpname],[data-cardtarget],[data-memname],[data-bkname]')){ e.preventDefault(); e.target.blur(); return; }
  if(e.key==='Escape' && !$('#sheet').hidden){ closeSheet(); return; }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!typing && $('#sheet').hidden && (e.key==='n' || e.key==='+') && !e.metaKey && !e.ctrlKey && !['assets','secret','settings'].includes(view)){ e.preventDefault(); openTx(); }
});
document.addEventListener('toggle', e => { const d = e.target; if(d.dataset && d.dataset.grp){ d.open ? openGroups.add(d.dataset.grp) : openGroups.delete(d.dataset.grp); } }, true);
window.addEventListener('storage', e => { if(e.key===KEY){ S = load(); render(); } });

save(); // 이전 버전 데이터를 새 구조로 저장
render();
if('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
</html>
